# SECURITY AUDIT 2026-07-28 — Phase 4: API key moved to pre-created Secret.
# NOTE: For production, use sealed secrets (bitnami-labs/sealed-secrets),
# HashiCorp Vault, or external-secrets-operator instead of plain base64.
#
# IMPORTANT: ENGINEERING_SERVICE_API_KEY is no longer stored here.
# It is provisioned via the pre-created "etap-api-key" Secret
# (see k8s/etap-api-key-secret.yaml), which MUST be created before
# Helm deployment. The deployment template references etap-api-key
# via secretKeyRef.
#
# This Helm-managed secret is reserved for other application secrets
# (extraSecretData) that are NOT API keys.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "etap-ai.fullname" . }}-secrets
  labels:
    {{- include "etap-ai.labels" . | nindent 4 }}
  {{- with .Values.env.externalSecretAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- with .Values.env.extraSecretData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
