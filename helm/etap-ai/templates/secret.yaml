# SECURITY AUDIT 2026-07-26 — Phase 3: Enhanced secret template.
# NOTE: For production, use sealed secrets (bitnami-labs/sealed-secrets),
# HashiCorp Vault, or external-secrets-operator instead of plain base64.
# This template supports referencing externally-managed secrets via
# .Values.env.EXTERNAL_SECRET_ANNOTATIONS.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "etap-ai.fullname" . }}-secrets
  labels:
    {{- include "etap-ai.labels" . | nindent 4 }}
  {{- with .Values.env.externalSecretAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if .Values.env.ENGINEERING_SERVICE_API_KEY }}
  api-key: {{ .Values.env.ENGINEERING_SERVICE_API_KEY | b64enc | quote }}
  {{- end }}
  {{- with .Values.env.extraSecretData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
