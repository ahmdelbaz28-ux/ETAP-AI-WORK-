# zenon Field Mapping Configuration (v1)
# Maps zenon variable tags and schema attributes to AhmedETAP electrical model fields.
# If a field is not listed here and not found in the standard contract,
# an explicit warning is emitted (no silent synthetic guessing).

version: "1.0.0"

