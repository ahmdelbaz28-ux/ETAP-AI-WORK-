  U_NOM: "base_kv"
  UN: "base_kv"
  NOMINAL_VOLTAGE: "base_kv"
  V_MAG: "v_mag"
  V_ANG: "v_ang"
  VM: "v_mag"
  VA: "v_ang"

line_mapping:
  R: "r_pu"
  X: "x_pu"
  B: "b_pu"
  R1: "r_pu"
  X1: "x_pu"
  B1: "b_pu"
  LENGTH: "length_km"
  LEN_KM: "length_km"
  I_MAX: "rating_a"
  INOM: "rating_a"
  S_MAX: "rating_mva"
  SNOM: "rating_mva"

cable_mapping:
  R: "r_pu"
