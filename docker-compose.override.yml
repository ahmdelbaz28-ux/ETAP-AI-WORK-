# =============================================================================
# AhmedETAP — Docker Compose Override for Local Development Hot Reload
# =============================================================================
# This file is automatically merged with docker-compose.yml by Docker Compose.
# It provides development-specific overrides for hot reload, debug ports,
# and watch mode. Production overrides should NEVER be in this file.
#
# Usage:
#   docker compose up                    # Production-like (no override)
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up
#                                        # Development with hot reload
#
# Docker Compose v2.22+ watch mode:
#   docker compose watch                 # Auto-rebuild on file changes
#
# ⚠️ NEVER commit this file with real secrets. Development secrets only.
# =============================================================================
services:
  engineering-service:
    # ── Hot reload: mount source code as volumes ────────────────────────────
    # The production docker-compose.yml only mounts specific directories.
    # The override mounts ALL source directories so changes are reflected
    # immediately without rebuilding the Docker image.
    volumes:
      - ./engineering_service.py:/app/engineering_service.py
      - ./compat.py:/app/compat.py
      - ./core:/app/core
      - ./services:/app/services
      - ./api:/app/api
      - ./etap_integration:/app/etap_integration
      - ./worker:/app/worker
      - ./agents:/app/agents
      - ./engine:/app/engine
      - ./core_model:/app/core_model
      - ./fault_analysis:/app/fault_analysis
      - ./load_flow:/app/load_flow
      - ./network_solver:/app/network_solver
      - ./coordination:/app/coordination
      - ./relays:/app/relays
      - ./curves:/app/curves
      - ./visualization:/app/visualization
      - ./security:/app/security
      - ./knowledge:/app/knowledge
      - ./ml:/app/ml
      - ./utils:/app/utils
      - ./digital_twin:/app/digital_twin
      - ./scada_model:/app/scada_model
      - ./adms_control:/app/adms_control
      - ./guards:/app/guards
      - ./copilot:/app/copilot
      - ./gis_integration:/app/gis_integration
      - ./gis_model:/app/gis_model
      - ./gis_validation:/app/gis_validation
      - ./gis_validation_electrical:/app/gis_validation_electrical
      - ./gis_validation_real:/app/gis_validation_real
      - ./autodesk_connector:/app/autodesk_connector
      - ./skills:/app/skills
      - ./reporting:/app/reporting
      - ./prompts:/app/prompts
      - ./config:/app/config
      - ./schemas:/app/schemas
      - ./migrations:/app/migrations
      - ./ai_context_engine:/app/ai_context_engine
      - ./integrations:/app/integrations
      - ./backend:/app/backend
      - ./acp_runtime:/app/acp_runtime
      # Read-only mounts for files that shouldn't be modified at runtime
      - ./VERSION:/app/VERSION:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./ruff.toml:/app/ruff.toml:ro

    # ── Development environment overrides ────────────────────────────────────
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      # Enable uvicorn reload mode for hot code changes
      - ENGINEERING_SERVICE_RELOAD=true

    # ── Override the command to use uvicorn with --reload ────────────────────
    # Production uses `python engineering_service.py` which runs uvicorn
    # without reload. Development uses uvicorn directly with --reload.
    command: ["uvicorn", "api.routes:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]

    # ── Relaxed resource limits for development ──────────────────────────────
    # Production has strict CPU/memory limits. Development needs more headroom
    # for debugging, profiling, and experimentation.
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4Gi
        reservations:
          cpus: '0.25'
          memory: 256Mi

    # ── Expose debug ports (only in development) ────────────────────────────
    # Production docker-compose.yml only exposes port 8000.
    # Development also exposes:
    #   - 5678: Python debugpy remote debugging
    #   - 9090: Prometheus metrics
    ports:
      - "8000:8000"
      - "127.0.0.1:5678:5678"   # debugpy — localhost only
      - "127.0.0.1:9090:9090"   # prometheus metrics — localhost only

  celery-worker:
    # ── Hot reload for Celery worker ────────────────────────────────────────
    volumes:
      - ./worker:/app/worker
      - ./core:/app/core
      - ./services:/app/services
      - ./api:/app/api
      - ./etap_integration:/app/etap_integration
      - ./agents:/app/agents
      - ./engine:/app/engine
      - ./ml:/app/ml
      - ./utils:/app/utils
      - ./security:/app/security
      - ./knowledge:/app/knowledge

    # ── Development environment overrides ────────────────────────────────────
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG

    # ── Watch mode: auto-restart worker on code changes ──────────────────────
    # Celery doesn't have native --reload, but we can use watchfiles
    # (installed via pip) to auto-restart the worker process.
    command: ["watchfiles", "--filter", "python", "celery", "-A", "worker.celery_app", "worker", "--loglevel=debug"]

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2Gi
        reservations:
          cpus: '0.25'
          memory: 256Mi
