packages:
  - "ui"

# =============================================================================
# pnpm overrides — SECURITY: force upgraded versions of vulnerable transitive
# dependencies. pnpm 11+ reads overrides from pnpm-workspace.yaml (NOT from
# the `pnpm.overrides` field in package.json — that field is ignored).
# Source of the vulnerability list: GitHub Dependabot alerts on this repo
# (fetched 2026-08-03; refreshed 2026-08-08). Each entry below corresponds to
# one or more open alerts that are fixed by the pinned version.
# =============================================================================
overrides:
  # HIGH: qs array-limit bypass and DoS (GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g)
  qs: ^6.16.0
  # CRITICAL: protobufjs 8.0.1 had Arbitrary Code Execution (CVE) — 25 alerts.
  # Was pinned to 8.0.1 via the old `overrides` block in package.json, which
  # is exactly the vulnerable version. Bumping to 8.6.6 fixes all 25 alerts.
  protobufjs: ^8.6.6
  # HIGH: langsmith SDK SSRF + prototype pollution + redaction bypass (8 alerts).
  # The langwatch package transitively pulls langsmith 0.3.87 (vulnerable).
  # Dependabot suggested fix>=0.6.0, but latest npm release is 0.8.9 — using ^0.8.0.
  langsmith: ^0.8.0
  # HIGH: axios prototype pollution + proxy inheritance + body limit bypass (10 alerts)
  axios: ^1.18.0
  # HIGH: brace-expansion DoS via exponential-time expansion (8 alerts)
  brace-expansion: ^5.0.9
  # HIGH: fast-uri host confusion via failed IDN canonicalization (2 alerts)
  fast-uri: ^3.1.5
  # HIGH: hono CORS reflection + XSS + path traversal + body limit bypass (8 alerts)
  hono: ^4.12.34
  # HIGH: js-yaml quadratic CPU consumption on merge-key chains (3 alerts)
  js-yaml: ^4.3.0
  # HIGH: linkify-it quadratic DoS in mailto validator (1 alert)
  linkify-it: ^5.0.2
  # HIGH: liquidjs memory-limit bypass in `pop` filter (1 alert)
  liquidjs: ^10.27.1
  # HIGH: postCSS path traversal via sourceMappingURL (1 alert)
  postcss: ^8.5.18
  # HIGH: shell-quote quadratic DoS in parse() (1 alert)
  shell-quote: ^1.9.0
  # MEDIUM: tar uncontrolled recursion in mapHas/filesFilter (1 alert)
  tar: ^7.5.21
  # MEDIUM: uuid missing buffer bounds check in v3/v5/v6 (2 alerts)
  uuid: ^11.1.1
  # LOW: body-parser DoS when invalid limit silently disables size enforcement (1 alert)
  body-parser: ^2.3.0
  # HIGH: OpenTelemetry Prometheus exporter crash via malformed HTTP (2 alerts)
  '@opentelemetry/exporter-prometheus': ^0.217.0
  # HIGH: OpenTelemetry sdk-node same Prometheus exporter issue (2 alerts)
  '@opentelemetry/sdk-node': ^0.217.0
  # HIGH: OpenTelemetry JaegerPropagator DoS via malformed header (2 alerts)
  '@opentelemetry/propagator-jaeger': ^2.9.0
  # MEDIUM: OpenTelemetry Core unbounded memory in W3C Baggage (2 alerts)
  '@opentelemetry/core': ^2.8.0
  # MEDIUM: @hono/node-server path traversal via encoded backslash on Windows (2 alerts)
  '@hono/node-server': ^2.0.5
  # CRITICAL: undici — 12 Dependabot alerts (3 HIGH, 8 MEDIUM, 1 LOW) across
  # WebSocket DoS, CRLF injection, HTTP smuggling, cookie injection, etc.
  # Node.js embeds undici internally but pnpm resolves a separate copy.
  # Override forces all transitive references to the patched v7.29.0+.
  undici: ^7.29.0
  # HIGH: @ai-sdk/provider-utils uncontrolled resource consumption (2 alerts, same CVE)
  # @mastra/core declares three aliased deps:
  #   - "@ai-sdk/provider-utils-v5": "npm:@ai-sdk/provider-utils@3.0.30"  (vulnerable)
  #   - "@ai-sdk/provider-utils-v6": "npm:@ai-sdk/provider-utils@4.0.40"
  #   - "@ai-sdk/provider-utils-v7": "npm:@ai-sdk/provider-utils@5.0.11"
  # The bare override covers direct references; the three selector overrides
  # below rewrite each alias inside @mastra/core to a patched version
  # (4.0.42 satisfies > 3.0.97 and is API-compatible with the 4.x line).
  # LOW severity — code path only reachable from streaming LLM responses.
  '@ai-sdk/provider-utils': ^5.0.0
  # EXCEPTIONS: several @ai-sdk provider packages declare EXACT provider-utils
  # pins and break under the global ^5.0.0 redirect (ESM link errors — 5.0.x
  # removed the tool-factory exports those versions import):
  #   - @ai-sdk/gateway@3.x / @ai-sdk/openai@3.x declare exactly 4.0.45
  #     ('createProviderToolFactoryWithOutputSchema').
  #   - @ai-sdk/openai@2.x declares exactly 3.0.32
  #     ('createProviderDefinedToolFactoryWithOutputSchema').
  # Pin each to its declared version (4.0.45 > the 4.0.42 used for the
  # @mastra/core aliases above, so the same CVE coverage applies).
  '@ai-sdk/gateway>@ai-sdk/provider-utils': npm:@ai-sdk/provider-utils@4.0.45
  '@ai-sdk/openai@3>@ai-sdk/provider-utils': npm:@ai-sdk/provider-utils@4.0.45
  '@ai-sdk/openai@2>@ai-sdk/provider-utils': npm:@ai-sdk/provider-utils@3.0.32
  '@mastra/core>@ai-sdk/provider-utils-v5': npm:@ai-sdk/provider-utils@4.0.42
  '@mastra/core>@ai-sdk/provider-utils-v6': npm:@ai-sdk/provider-utils@4.0.42
  '@mastra/core>@ai-sdk/provider-utils-v4': npm:@ai-sdk/provider-utils@4.0.42
  # react-router / react-router-dom — multiple HIGH/MEDIUM alerts.
  # Re-verified 2026-08-08 against GitHub Dependabot API: patched version
  # 7.18.2 IS available on npm (the prior comment about "no fix" was stale).
  # Alerts closed by this bump:
  #   - GHSA-qwww-vcr4-c8h2 (HIGH) RSC Mode CSRF Bypass
  #   - GHSA-chx6-hx7r-mcp5 (HIGH) Unauthenticated DoS via Inefficient Pattern
  #   - GHSA-wrjc-x8rr-h8h6 (MED)  Open redirect via backslash in <Link>
  #   - GHSA-h8fp-f39c-q6mh (MED)  RSCErrorHandler Missing Protocol Validation (XSS)
  #   - GHSA-337j-9hxr-rhxg (MED)  Arbitrary Constructor Injection via deserialization
  react-router: ^7.18.2
  react-router-dom: ^7.18.2

allowBuilds:
  '@biomejs/biome': true
  '@tailwindcss/oxide': true
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: false
  protobufjs: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@tailwindcss/oxide'
  - electron
  - electron-winstaller
  - esbuild
  - protobufjs

minimumReleaseAgeExclude:
  - '@ai-sdk/provider-utils@4.0.42'
