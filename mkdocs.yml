site_name: AhmedETAP Documentation
site_description: Enterprise AI-Powered Power Systems Engineering Platform
site_author: Eng. Ahmed Elbaz / Platform Core Team
repo_url: https://github.com/ahmdelbaz28-ux/ETAP-AI-WORK-
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    primary: indigo
    accent: deep purple

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quick Start: QUICKSTART.md
  - Engineering Tutorials:
    - Overview: TUTORIALS/README.md
    - "01 - Load Flow to Protection": TUTORIALS/01_load_flow_short_circuit_protection.md
    - "02 - Motor Starting Analysis": TUTORIALS/02_motor_starting_voltage_drop.md
    - "03 - Arc Flash Evaluation": TUTORIALS/03_arc_flash_hazard_evaluation.md
  - API Specifications:
    - Canonical Reference: API_REFERENCE.md
    - QuickRef Cheat-Sheet: API_QUICKREF.md
    - Deprecated Guide: API_DOCUMENTATION.md
  - Architecture & Agents:
    - System Architecture: ARCHITECTURE.md
    - Agent Reference: AGENT_ARCHITECTURE.md
    - Status & Launch Readiness: STATUS.md
  - Operations & Reliability:
    - Operations Runbook: OPERATIONS_RUNBOOK.md
    - Troubleshooting Guide: TROUBLESHOOTING_GUIDE.md
    - Security Operations: SECURITY_OPERATIONS_MANUAL.md
    - Enterprise Certification: ENTERPRISE_CERTIFICATION_REPORT.md
  - Standards & Governance:
    - Standards Compliance Matrix: STANDARDS_COMPLIANCE_MATRIX.md
    - Platform Glossary: GLOSSARY.md
    - Documentation Standards: DOCUMENTATION_STANDARDS.md

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: info
    anchors: info
    absolute_links: info
