# SECURITY AUDIT 2026-07-25 — Fix S-12: Database/infra ports restricted to 127.0.0.1.
# Previously, Redis, Postgres, Neo4j, and Qdrant ports were exposed to all
# interfaces, allowing external access. Now bound to localhost only.
services:
  engineering-service:
    build:
      context: .
      dockerfile: Dockerfile.engineering-service
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - USE_ETAP=${USE_ETAP:-false}
      - PRIVACY_MODE=${PRIVACY_MODE:-false}
      - ENGINEERING_SERVICE_API_KEY=${ENGINEERING_SERVICE_API_KEY:?ENGINEERING_SERVICE_API_KEY is required}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://etap:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/etap_platform
    # HEALTHCHECK: python urllib is used instead of curl because the
    # engineering-service image (python slim) does not bundle curl/wget.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # CRITICAL FIX: Added resource limits to prevent resource exhaustion.
    # Per CI/CD skill: production services must have CPU/memory boundaries.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2Gi
        reservations:
          cpus: '0.5'
          memory: 512Mi
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - etap_data:/data
      - ./engineering_service.py:/app/engineering_service.py
      - ./core:/app/core
      - ./services:/app/services
      - ./api:/app/api
      - ./etap_integration:/app/etap_integration
      - ./worker:/app/worker
    networks:
      - etap_network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.engineering-service
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      - USE_ETAP=${USE_ETAP:-false}
      - PRIVACY_MODE=${PRIVACY_MODE:-false}
      - ENGINEERING_SERVICE_API_KEY=${ENGINEERING_SERVICE_API_KEY:?ENGINEERING_SERVICE_API_KEY is required}
      - DATABASE_URL=${DATABASE_URL:-postgresql://etap:etap@postgres:5432/etap_db}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    # CRITICAL FIX: Added resource limits for Celery worker.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1Gi
        reservations:
          cpus: '0.25'
          memory: 256Mi
    # SECURITY AUDIT 2026-07-29 (self-critique pass, HB-11):
    # Previous depends_on included `engineering-service: service_started`,
    # which created an unnecessary coupling: if engineering-service crashed
    # or was slow to start, Celery was blocked from starting too. Celery
    # only needs Redis (as its broker) and the code (mounted via volumes)
    # — it does NOT call the engineering-service HTTP API. The dependency
    # was leftover from when tasks shared state via the API service.
    # Fix: depend only on Redis. Celery now starts as soon as Redis is
    # healthy, independent of the API service state.
    # HEALTHCHECK: celery inspect ping requires the broker (redis) healthy —
    # reuses the same image as engineering-service (celery is installed).
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./worker:/app/worker
      - ./core:/app/core
      - ./services:/app/services
      - ./api:/app/api
      - ./etap_integration:/app/etap_integration
    networks:
      - etap_network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # SECURITY: REDISCLI_AUTH is the official way to pass Redis auth to
    # redis-cli without exposing the password on the command line (which
    # leaks it into /proc/<pid>/cmdline). We pass REDISCLI_AUTH as an
    # environment variable so the healthcheck shell inherits it directly —
    # no $$-escaping needed, no Compose substitution pitfalls.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etap_network

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etap_db}
      POSTGRES_USER: ${POSTGRES_USER:-etap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etap_network

  grafana:
    image: grafana/grafana-enterprise
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana_storage:/var/lib/grafana
    # HEALTHCHECK: the official grafana image bundles curl.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - etap_network
    depends_on:
      - postgres

  qdrant:
    image: qdrant/qdrant:1.12.4
    container_name: etap-qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - etap_network
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    # HEALTHCHECK: per qdrant/qdrant official docs — the image bundles curl.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    container_name: etap-neo4j
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    # CRITICAL FIX: Added resource limits for Neo4j.
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2Gi
        reservations:
          cpus: '0.5'
          memory: 512Mi
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    # HEALTHCHECK: uses cypher-shell (bundled with the neo4j image) instead
    # of curl — curl is not guaranteed in the official neo4j image.
    # Authenticates over Bolt (:7687) using the password from NEO4J_AUTH.
    healthcheck:
      test: ["CMD-SHELL", "PASS=$${NEO4J_AUTH#*/}; cypher-shell -u neo4j -p \"$$PASS\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - etap_network

volumes:
  etap_data:
  redis_data:
  postgres_data:
  grafana_storage:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:

networks:
  etap_network:
    driver: bridge