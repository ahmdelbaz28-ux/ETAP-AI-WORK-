<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AhmedETAP Documentation Logo">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="docLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="docRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="docTopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <linearGradient id="docGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="256" cy="256" r="220" fill="url(#docGlowGrad)" />

  <!-- Isometric 3D Hexagonal Node Base -->
  <!-- Left Side: Indigo to Blue (representing generation / inputs) -->
  <path
    d="M256,70 L256,256 L90,352 L90,166 Z"
    fill="url(#docLeftGrad)"
    stroke="#070b14"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Right Side: Dark Teal to Emerald (representing output / distribution) -->
  <path
    d="M256,256 L422,352 L422,166 L256,70 Z"
    fill="url(#docRightGrad)"
    stroke="#070b14"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Top/Base Plane: Blue to Cyan (representing system matrix & grounding) -->
  <path
    d="M90,352 L256,256 L422,352 L256,448 Z"
    fill="url(#docTopGrad)"
    stroke="#070b14"
    stroke-width="6"
    stroke-linejoin="round"
  />

  {/* High-Precision Schematic Overlay (futuristic HUD wireframe) */}
  <line x1="90" y1="352" x2="256" y2="256" stroke="#ffffff" stroke-width="3" opacity="0.35" />
  <line x1="422" y1="352" x2="256" y2="256" stroke="#ffffff" stroke-width="3" opacity="0.35" />
  <line x1="256" y1="70" x2="256" y2="256" stroke="#ffffff" stroke-width="3" opacity="0.35" />

  {/* Left plane node track */}
  <path d="M150,210 L256,256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <circle cx="150" cy="210" r="12" fill="#00d4ff" stroke="#ffffff" stroke-width="3" />

  {/* Right plane node track */}
  <path d="M362,210 L256,256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <circle cx="362" cy="210" r="12" fill="#0d9488" stroke="#ffffff" stroke-width="3" />

  {/* Ground node track */}
  <path d="M256,370 L256,256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
  <circle cx="256" cy="370" r="12" fill="#00d4ff" stroke="#ffffff" stroke-width="3" />

  {/* Central hub connection */}
  <circle cx="256" cy="256" r="16" fill="#ffffff" stroke="#00d4ff" stroke-width="6" />
  <circle cx="256" cy="256" r="6" fill="#070b14" />
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AhmedETAP logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="220" fill="#2563eb" opacity="0.12"/>
  <circle cx="130" cy="230" r="260" fill="#7c3aed" opacity="0.12"/>
  <text x="90" y="120" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">ETAP</text><text x="90" y="165" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#93c5fd">AI Engineering Platform</text><path d="M760 82 C820 20 930 20 990 82 L990 210 C930 272 820 272 760 210 Z" fill="url(#brand)" opacity="0.92"/><path d="M810 148 L870 92 L940 148 L895 148 L895 216 L845 216 L845 148 Z" fill="#ffffff" opacity="0.94"/><path d="M80 248 C280 205 450 205 650 248" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
</svg>
