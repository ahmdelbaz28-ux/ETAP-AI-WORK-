# =============================================================================
# AhmedETAP — etap-api-key Kubernetes Secret (PRE-DEPLOY MANIFEST)
# =============================================================================
# CRITICAL: This secret MUST be created BEFORE deploying the Helm chart.
# The Helm deployment template references this secret by name (etap-api-key)
# for the ENGINEERING_SERVICE_API_KEY environment variable.
#
# Per CI/CD skill: "Shift Left" — secrets should be provisioned before
# application deployment, not baked into Helm values.
#
# SECURITY: This manifest uses a PLACEHOLDER value. DO NOT apply it directly
# with the placeholder — use one of the methods below instead.
#
# FIXED: Removed helm.sh/hook annotations. This is a STANDALONE pre-deploy
# manifest, NOT a Helm hook. Helm hooks have lifecycle behavior (delete before
# creation) that contradicts the "pre-created secret" intent. The secret must
# exist BEFORE helm install/upgrade, and must NOT be managed by Helm.
# If Helm manages it, `helm uninstall` would delete the secret, breaking
# subsequent upgrades.
#
# Usage:
#   # Option A: kubectl create (recommended — value not in git)
#   kubectl create secret generic etap-api-key \
#     --from-literal=api-key=<your-real-api-key> \
#     --namespace=ahmedetap
#
#   # Option B: Apply this manifest with a real value (dev only)
#   # Edit the api-key value below before applying — NEVER commit the real key
#   kubectl apply -f k8s/etap-api-key-secret.yaml
#
#   # Option C: sealed-secrets (production — encrypts the secret for git storage)
#   kubectl create secret generic etap-api-key \
#     --from-literal=api-key=<your-real-api-key> \
#     --namespace=ahmedetap \
#     --dry-run=client -o yaml | \
#     kubeseal -o yaml > k8s/sealed-etap-api-key-secret.yaml
#
#   # Option D: external-secrets-operator (production — syncs from Vault/Azure KeyVault)
#   # See: https://external-secrets.io/latest/
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: etap-api-key
  namespace: ahmedetap
  labels:
    app.kubernetes.io/name: etap-ai
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: manual  # NOT managed by Helm — pre-created
type: Opaque
data:
  # PLACEHOLDER — replace with your real API key (base64 encoded) before applying.
  # Generate base64: echo -n 'your-real-api-key' | base64
  # NEVER commit the real value to git.
  api-key: "REPLACE_ME_WITH_BASE64_ENCODED_API_KEY"
