# =============================================================================
# Dependabot Configuration
# Per ci-cd-and-automation skill: automate dependency updates
# =============================================================================
version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - maintainers
    labels:
      - dependencies
      - automated

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - ci
      - dependencies
      - automated
