version: 2
updates:
  # Python dependencies (existing ETAP project)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - auto-generated

  # Python uv lockfile updater
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - auto-generated

  # npm dependencies (root monorepo)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@vitest/mocker"
    labels:
      - dependencies
      - auto-generated

  # npm dependencies (ui)
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@vitest/mocker"
    labels:
      - dependencies
      - auto-generated

  # npm dependencies (new TS service)
  - package-ecosystem: npm
    directory: /ts-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - auto-generated

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - ci
      - dependencies
      - auto-generated
