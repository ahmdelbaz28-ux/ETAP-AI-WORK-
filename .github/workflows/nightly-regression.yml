name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scheduled-regression:
    name: Nightly Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ENVIRONMENT: testing
      JWT_SECRET_KEY: ci-test-jwt-secret-key-for-github-actions-32-bytes-min
      ENCRYPTION_KEY: integration-test-encryption-key-not-for-production-32b
      DATABASE_URL: sqlite+aiosqlite:///./test_nightly.db
      SKIP_LIVE_SCENARIO_TESTS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt ruff pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout respx

      - name: Ruff lint check
        run: ruff check . --config ruff.toml

      - name: Python syntax validation
        run: python3 validate_syntax.py

      - name: Engineering validation suite
        run: python3 scripts/dev/validation_suite.py

      - name: Pytest with coverage
        run: |
          pytest tests/ \
            --ignore=tests/load \
            --ignore=tests/stress \
            --ignore=tests/chaos \
            -m "not external and not database_required" \
            -q \
            -n auto \
            --timeout=60 \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --tb=short \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.5.0
        with:
          name: test-results-nightly-${{ github.sha }}
          path: test-results.xml

      - name: Generate regression report
        run: |
          python3 -c 'import json, datetime; results = {"timestamp": datetime.datetime.utcnow().isoformat() + "Z", "status": "completed"}; open("regression-report.json", "w").write(json.dumps(results, indent=2))'

      - name: Upload regression report
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-regression-report
          path: regression-report.json
          retention-days: 90
          compression-level: 1
