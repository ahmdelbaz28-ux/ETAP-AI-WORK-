name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scheduled-regression:
    name: Nightly Regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt ruff pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout respx

      - name: Ruff lint check
        run: ruff check . --config ruff.toml

      - name: Python syntax validation
        run: python3 validate_syntax.py

      - name: Engineering validation suite
        run: python3 scripts/dev/validation_suite.py

      - name: Pytest with coverage
        run: |
          pytest tests/ \
            --ignore=tests/load \
            --ignore=tests/stress \
            --ignore=tests/chaos \
            -q \
            -n auto \
            --timeout=60 \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --tb=short

      - name: Generate regression report
        run: |
          python3 -c 'import json, datetime; results = {"timestamp": datetime.datetime.utcnow().isoformat() + "Z", "status": "completed"}; open("regression-report.json", "w").write(json.dumps(results, indent=2))'

      - name: Upload regression report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: scheduled-regression-report
          path: regression-report.json
          retention-days: 90
          compression-level: 1
