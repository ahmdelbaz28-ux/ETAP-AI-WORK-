name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly scan of full history at 04:00 UTC every Monday
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # required for SARIF upload

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for baseline comparison

      - name: Run Gitleaks via Docker
        shell: bash
        # NOTE: Using Docker directly instead of gitleaks/gitleaks-action@v2
        # because the action relied on Node.js 20 (now deprecated). Running
        # gitleaks via Docker avoids the Node.js wrapper entirely and runs
        # natively in the container on Node.js 24 runners.
        # Pipefail ensures docker exit-code=1 is not swallowed by tee.
        # Single-pass execution produces both SARIF report and verbose redacted output.
        run: |
          set -eo pipefail
          docker run --rm \
            -v "${PWD}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --gitleaks-ignore-path=/repo/.gitleaksignore \
            --report-format=sarif \
            --report-path=/repo/gitleaks-results.sarif \
            --verbose \
            --redact \
            --exit-code=1 \
            2>&1 | tee /tmp/gitleaks-output.txt
          echo "Gitleaks scan complete — no secrets detected"

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-results.sarif

  custom-patterns:
    name: Custom Secret Patterns (scripts/security_scan.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run security_scan.py
        run: python scripts/security_scan.py
