# =============================================================================
# Deployment Pipeline — Staged Rollout with Preview + Rollback
# Per the ci-cd-and-automation skill: Preview → Staging → Production → Monitor
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy (optional)'
        required: false
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # ── Verify CI passed first ─────────────────────────────────────────────
  verify-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check CI workflow status
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              status: 'success',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No successful CI run found on main. Deploy blocked.');
            }
            console.log('Latest successful CI run:', runs.data.workflow_runs[0]?.id);

  # ── Preview Deployment (on PR only) ────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy preview
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Staging Deployment ─────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    needs: [verify-ci]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Replace with actual deployment command:
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          # or: docker push && kubectl apply
          echo "Staging deployment complete"
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          NODE_ENV: staging

      - name: Smoke test staging
        run: |
          echo "Running smoke tests against staging..."
          # curl -f https://staging.example.com/health || exit 1
          echo "Staging smoke tests passed"

  # ── Production Deployment ──────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    if: github.event.inputs.environment == 'production'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Replace with actual deployment command
          echo "Production deployment complete"
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          NODE_ENV: production

      - name: Post-deploy health check
        run: |
          echo "Running post-deployment health check..."
          # curl -f https://example.com/health || exit 1
          echo "Health check passed"

      - name: Monitor for errors (15-minute window)
        run: |
          echo "Monitoring for errors for 15 minutes..."
          # In production, this would check error rates, response times, etc.
          # sleep 900 && curl -f https://example.com/health
          echo "Monitoring complete — no errors detected"

  # ── Notify on failure ──────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    if: failure()
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    steps:
      - name: Send notification
        run: |
          echo "Deployment failed — notification sent"
          # In production: send Slack/Discord/email notification
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} -d '{"text":"Deployment failed!"}'
