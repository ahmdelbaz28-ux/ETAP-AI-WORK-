# =============================================================================
# CI Pipeline — Full 8-Gate Quality Pipeline
# Per ci-cd-and-automation skill: every change goes through these gates
# before merge. No gate can be skipped.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  # ── Gate 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Lint (tsc --noEmit)
        run: pnpm run lint

  # ── Gate 2: Type Check ───────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm run lint

  # ── Gate 3: Unit Tests ───────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Unit tests (vitest)
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Scenario tests (vitest)
        run: pnpm test:scenarios
        env:
          NODE_ENV: test
          SKIP_LIVE_SCENARIO_TESTS: "true"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Gate 4: Build ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: ignore

  # ── Gate 5: Integration Tests ────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: "pip install --only-binary :all: --requirement requirements.txt"

      - name: Dependency alignment verification (FIX-25)
        run: pip check

      - name: Install test runner
        run: "pip install --only-binary :all: pytest==8.3.5 pytest-asyncio==0.25.3"

      - name: Run Integration Tests
        run: pytest tests/test_audit_phase2_fixes.py tests/test_hf_space_fail_closed.py

  # ── Gate 6: SCADA & Scenario Tests (FIX-30) ──────────────────────────────
  scenario-tests:
    name: SCADA & Scenario Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: etap
          POSTGRES_PASSWORD: etap_test_password
          POSTGRES_DB: etap_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: "pip install --only-binary :all: --requirement requirements.txt pytest==8.3.5 pytest-asyncio==0.25.3"

      - name: Run SCADA and Multi-Agent Scenarios
        env:
          DATABASE_URL: "postgresql+asyncpg://etap:etap_test_password@localhost:5432/etap_platform_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: pytest tests/scenarios/test_*_scenario.py -v

  # ── Gate 7: Security Audit ───────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: pnpm audit
        run: pnpm audit --audit-level=critical

      - name: Set up Python for Security Scan
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt

      - name: Bandit (shared gate)
        uses: ./.github/actions/bandit-scan

      - name: Secrets scan
        run: |
          SECRETS_FOUND=0
          if grep -rn 'AKIA[0-9A-Z]\{16\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::AWS Access Key found in source code"
            SECRETS_FOUND=1
          fi
          if grep -rn 'sk-[a-zA-Z0-9]\{20,\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::OpenAI API key found in source code"
            SECRETS_FOUND=1
          fi
          if grep -rn 'ghp_[a-zA-Z0-9]\{36\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::GitHub token found in source code"
            SECRETS_FOUND=1
          fi
          if [ "$SECRETS_FOUND" -eq 1 ]; then
            echo "::error::Secrets detected in source code"
            exit 1
          fi
          echo "No secrets found in source code"

      - name: UI Bundle Provider Keys Scan (FIX-29)
        run: python scripts/check_bundle_secrets.py

  # ── Gate 8: Bundle Size Check ────────────────────────────────────────────
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify build artifacts and size
        run: pnpm run bundlesize

  # ── Summary ──────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, integration-tests, security-audit, bundle-size]
    if: always()
    steps:
      - name: Check all gates passed
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.typecheck.result }}" == "success" && \
                "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.integration-tests.result }}" == "success" && \
                "${{ needs.security-audit.result }}" == "success" && \
                "${{ needs.bundle-size.result }}" == "success" ]]; then
            echo "All 8 quality gates passed successfully"
            exit 0
          else
            echo "One or more quality gates failed"
            exit 1
          fi
