# =============================================================================
# CI Pipeline — Full 8-Gate Quality Pipeline
# Per ci-cd-and-automation skill: every change goes through these gates
# before merge. No gate can be skipped.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc --noEmit)
        run: npm run lint
        # NOTE: 'format:check' removed — root package.json does not configure
        # Prettier. The UI package (ui/) has its own format check; this root
        # workflow only needs the TypeScript type-check.

  # ── Gate 2: Type Check ───────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # Root package.json's 'lint' script IS tsc --noEmit (type checking).
        # There is no separate 'typecheck' script; reuse 'lint'.
        run: npm run lint

  # ── Gate 3: Unit Tests ───────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (vitest)
        # Root package.json uses vitest (script 'test'), not jest. There is
        # no separate 'test:unit' script; 'test' runs vitest which covers
        # unit tests. Coverage is handled by vitest's built-in coverage.
        run: npm run test
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Gate 4: Build ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ── Gate 5: Integration Tests ────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test runner
        run: pip install pytest pytest-asyncio

      - name: Run Integration Tests
        run: pytest tests/test_audit_phase2_fixes.py tests/test_hf_space_fail_closed.py

  # ── Gate 6: E2E Tests (optional) ────────────────────────────────────────
  # Skipped until Playwright is configured. Uncomment when ready.

  # ── Gate 7: Security Audit ───────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install --ignore-scripts

      - name: npm audit
        run: npm audit --audit-level=critical
        continue-on-error: false

      - name: Secrets scan
        run: |
          SECRETS_FOUND=0
          if grep -rn 'AKIA[0-9A-Z]\{16\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::AWS Access Key found in source code"
            SECRETS_FOUND=1
          fi
          if grep -rn 'sk-[a-zA-Z0-9]\{20,\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::OpenAI API key found in source code"
            SECRETS_FOUND=1
          fi
          if grep -rn 'ghp_[a-zA-Z0-9]\{36\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::GitHub token found in source code"
            SECRETS_FOUND=1
          fi
          if [ "$SECRETS_FOUND" -eq 1 ]; then
            echo "::error::Secrets detected in source code"
            exit 1
          fi
          echo "No secrets found in source code"

  # ── Gate 8: Bundle Size Check ────────────────────────────────────────────
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify build artifacts and size
        run: npm run bundlesize

  # ── Summary ──────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, integration-tests, security-audit, bundle-size]
    if: always()
    steps:
      - name: Check all gates passed
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.typecheck.result }}" == "success" && \
                "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.integration-tests.result }}" == "success" && \
                "${{ needs.security-audit.result }}" == "success" && \
                "${{ needs.bundle-size.result }}" == "success" ]]; then
            echo "All 8 quality gates passed successfully"
            exit 0
          else
            echo "One or more quality gates failed"
            exit 1
          fi
