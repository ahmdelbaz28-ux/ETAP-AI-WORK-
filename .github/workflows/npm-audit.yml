# npm Audit Security Gate
# ─────────────────────────────────────────────────────────────────────────────
# Implements the "Security Audit" quality gate from the ci-cd-and-automation
# skill (SKILL.md → "The Quality Gate Pipeline" → SECURITY AUDIT → npm audit).
#
# Behaviour:
#   - Runs `npm audit --audit-level=high --json` against ui/package-lock.json
#     (the UI is the Node.js package surface for this repo).
#   - Filters out advisories listed in .github/npm-audit-exceptions.txt
#     (each exception has a documented rationale + re-review trigger).
#   - Exits 0 if no non-excepted high/critical vulnerabilities remain.
#   - Exits 1 (blocking) otherwise.
#
# Per the skill: "No gate can be skipped. If a test fails, fix the code —
# don't skip the test." Exceptions are NOT skips — they are documented
# acceptances of advisories that have no patched version available, with
# a recorded rationale and re-review trigger.
# ─────────────────────────────────────────────────────────────────────────────
name: npm Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC — catches newly-disclosed advisories even if no
    # push/PR happens that day.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  npm-audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run npm/pnpm audit with exception filter
        working-directory: ui
        env:
          EXCEPTIONS_FILE: ${{ github.workspace }}/.github/npm-audit-exceptions.txt
          AUDIT_JSON_PATH: /tmp/audit.json
          AUDIT_ERR_PATH: /tmp/audit.err
        run: |
          set -euo pipefail

          # Verify the exceptions file exists.
          if [ ! -f "$EXCEPTIONS_FILE" ]; then
            echo "::error::Exceptions file not found: $EXCEPTIONS_FILE"
            exit 2
          fi

          # Extract GHSA IDs (strip comments + blanks), join with `|` so the
          # Node script can split on `|` to build the exception set.
          EXCEPTIONS=$(grep -vE '^\s*#' "$EXCEPTIONS_FILE" | grep -E '^GHSA-' | tr -d '\r' | awk '{$1=$1};1' | paste -sd'|' - || true)
          export EXCEPTIONS
          echo "Excepted advisory IDs: ${EXCEPTIONS:-<none>}"

          # Run pnpm audit as JSON so we can parse + filter programmatically.
          # --audit-level=high means report high + critical only.
          set +e
          pnpm audit --audit-level=high --json > "$AUDIT_JSON_PATH" 2> "$AUDIT_ERR_PATH"
          AUDIT_EXIT=$?
          set -e

          # Ensure JSON output exists and is non-empty.
          if [ ! -s "$AUDIT_JSON_PATH" ]; then
            echo "::error::audit produced no JSON output."
            cat "$AUDIT_ERR_PATH" >&2 || true
            exit 2
          fi

          # Use Node (already installed via setup-node) to parse + filter.
          node <<'NODE_SCRIPT'
          const fs = require('fs');
          const exceptionsFile = process.env.EXCEPTIONS_FILE;
          let exceptions = [];
          if (exceptionsFile && fs.existsSync(exceptionsFile)) {
            exceptions = fs.readFileSync(exceptionsFile, 'utf8')
              .split('\n')
              .map(line => line.trim())
              .filter(line => line && !line.startsWith('#') && line.startsWith('GHSA-'));
          } else {
            exceptions = (process.env.EXCEPTIONS || '').split('|').map(s => s.trim()).filter(Boolean);
          }
          const auditPath = process.env.AUDIT_JSON_PATH;
          const report = JSON.parse(fs.readFileSync(auditPath, 'utf8'));

          const BLOCKING_LEVELS = new Set(['high', 'critical']);
          const vulns = report.vulnerabilities || {};
          const advisories = report.advisories || {};
          const blocking = [];
          const excepted = [];
          const skippedBelowLevel = [];
          const skippedNoGhsa = [];

          function ghsaFromUrl(url) {
            if (!url || typeof url !== 'string') return null;
            const last = url.split('/').filter(Boolean).pop();
            return last && last.startsWith('GHSA-') ? last : null;
          }

          // Handle npm-style vulnerabilities object
          for (const [pkg, info] of Object.entries(vulns)) {
            const via = Array.isArray(info.via) ? info.via : [];
            for (const v of via) {
              if (typeof v === 'string') continue;
              const sev = v && typeof v.severity === 'string' ? v.severity.toLowerCase() : 'unknown';
              if (!BLOCKING_LEVELS.has(sev)) {
                skippedBelowLevel.push({ pkg, severity: sev, title: v && v.title });
                continue;
              }
              const ghsa = ghsaFromUrl(v && v.url);
              if (!ghsa) {
                skippedNoGhsa.push({ pkg, severity: sev, title: v && v.title, source: v && v.source });
                continue;
              }
              const entry = {
                pkg,
                ghsa,
                severity: sev,
                name: v.name,
                title: v.title,
                url: v.url,
              };
              if (exceptions.includes(ghsa)) {
                excepted.push(entry);
              } else {
                blocking.push(entry);
              }
            }
          }

          // Handle pnpm-style advisories object
          for (const adv of Object.values(advisories)) {
            const sev = adv && typeof adv.severity === 'string' ? adv.severity.toLowerCase() : 'unknown';
            const pkgName = adv.module_name || adv.name || 'unknown';
            if (!BLOCKING_LEVELS.has(sev)) {
              skippedBelowLevel.push({ pkg: pkgName, severity: sev, title: adv.title });
              continue;
            }
            const ghsa = ghsaFromUrl(adv.url);
            if (!ghsa) {
              skippedNoGhsa.push({ pkg: pkgName, severity: sev, title: adv.title, source: adv.id });
              continue;
            }
            const entry = {
              pkg: pkgName,
              ghsa,
              severity: sev,
              name: pkgName,
              title: adv.title,
              url: adv.url,
            };
            if (exceptions.includes(ghsa)) {
              excepted.push(entry);
            } else {
              blocking.push(entry);
            }
          }

          console.log('--- npm audit summary ---');
          console.log('Total advisories found:', excepted.length + blocking.length + skippedBelowLevel.length + skippedNoGhsa.length);
          console.log('Blocking (must fix):    ', blocking.length);
          console.log('Excepted (documented):  ', excepted.length);
          console.log('Skipped (below high):    ', skippedBelowLevel.length);
          console.log('Skipped (no GHSA url):   ', skippedNoGhsa.length);
          console.log('');

          if (skippedBelowLevel.length > 0) {
            console.log('Advisories below audit level (informational, not blocking):');
            for (const s of skippedBelowLevel) {
              console.log(`  - ${s.pkg} [${s.severity}] ${s.title}`);
            }
            console.log('');
          }

          if (skippedNoGhsa.length > 0) {
            console.warn('::warning::Advisories with no GHSA url (cannot match against exception list):');
            for (const s of skippedNoGhsa) {
              console.warn(`  - ${s.pkg} [${s.severity}] ${s.title} (source: ${s.source})`);
            }
            console.warn('  These were NOT blocked. If any of these is high/critical,');
            console.warn('  file an issue to add manual exception handling.');
            console.log('');
          }

          if (excepted.length > 0) {
            console.log('Excepted advisories (see .github/npm-audit-exceptions.txt for rationale):');
            for (const e of excepted) {
              console.log(`  - ${e.pkg} ${e.ghsa} [${e.severity}] ${e.title} — ${e.url}`);
            }
            console.log('');
          }

          if (blocking.length > 0) {
            console.error('::error::Blocking npm audit advisories (high/critical, not excepted):');
            for (const b of blocking) {
              console.error(`  ::error::${b.pkg} ${b.ghsa} [${b.severity}] ${b.title} — ${b.url}`);
              console.error(`    Fix: upgrade ${b.pkg} to a patched version, or add ${b.ghsa} to .github/npm-audit-exceptions.txt with rationale.`);
            }
            process.exit(1);
          }

          console.log('::notice::npm audit passed — no unexpected high/critical vulnerabilities.');
          NODE_SCRIPT

          echo "npm-audit gate passed."
