# npm Audit Security Gate
# ─────────────────────────────────────────────────────────────────────────────
# Implements the "Security Audit" quality gate from the ci-cd-and-automation
# skill (SKILL.md → "The Quality Gate Pipeline" → SECURITY AUDIT → npm audit).
#
# Behaviour:
#   - Runs `npm audit --audit-level=high --json` against ui/package-lock.json
#     (the UI is the Node.js package surface for this repo).
#   - Filters out advisories listed in .github/npm-audit-exceptions.txt
#     (each exception has a documented rationale + re-review trigger).
#   - Exits 0 if no non-excepted high/critical vulnerabilities remain.
#   - Exits 1 (blocking) otherwise.
#
# Per the skill: "No gate can be skipped. If a test fails, fix the code —
# don't skip the test." Exceptions are NOT skips — they are documented
# acceptances of advisories that have no patched version available, with
# a recorded rationale and re-review trigger.
# ─────────────────────────────────────────────────────────────────────────────
name: npm Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC — catches newly-disclosed advisories even if no
    # push/PR happens that day.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Run npm audit with exception filter
        working-directory: ui
        env:
          EXCEPTIONS_FILE: ${{ github.workspace }}/.github/npm-audit-exceptions.txt
          AUDIT_JSON_PATH: /tmp/audit.json
          AUDIT_ERR_PATH: /tmp/audit.err
        run: |
          set -euo pipefail

          # Verify the exceptions file exists.
          if [ ! -f "$EXCEPTIONS_FILE" ]; then
            echo "::error::Exceptions file not found: $EXCEPTIONS_FILE"
            exit 2
          fi

          # Extract GHSA IDs (strip comments + blanks), join with `|` so the
          # Node script can split on `|` to build the exception set.
          EXCEPTIONS=$(grep -vE '^\s*#' "$EXCEPTIONS_FILE" | grep -E '^GHSA-' | tr -d '[:space:]' | paste -sd'|' - || true)
          export EXCEPTIONS
          echo "Excepted advisory IDs: ${EXCEPTIONS:-<none>}"

          # Run npm audit as JSON so we can parse + filter programmatically.
          # --audit-level=high means npm reports high + critical only.
          # npm audit exits 1 if any vuln >= the level is found — we capture
          # the JSON and re-evaluate after filtering exceptions.
          set +e
          npm audit --audit-level=high --json > "$AUDIT_JSON_PATH" 2> "$AUDIT_ERR_PATH"
          AUDIT_EXIT=$?
          set -e

          # npm audit always writes JSON to stdout when --json is passed,
          # regardless of exit code. If the file is empty or invalid, fail
          # loudly rather than silently passing.
          if [ ! -s "$AUDIT_JSON_PATH" ]; then
            echo "::error::npm audit produced no JSON output."
            cat "$AUDIT_ERR_PATH" >&2 || true
            exit 2
          fi

          # Use Node (already installed via setup-node) to parse + filter.
          # Args are passed via env vars (EXCEPTIONS, AUDIT_JSON_PATH) because
          # `node <<HEREDOC arg1 arg2` interprets arg1 as a script file path,
          # not as process.argv[2].
          node <<'NODE_SCRIPT'
          const exceptions = (process.env.EXCEPTIONS || '').split('|').filter(Boolean);
          const auditPath = process.env.AUDIT_JSON_PATH;
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(auditPath, 'utf8'));

          // npm audit JSON v3+: report.vulnerabilities is an object keyed by
          // package name; each value has `.via` array. Entries in `.via`
          // can be strings (transitive dep names) or objects with `source`
          // (NUMERIC advisory ID, NOT the GHSA ID), `url` (advisory URL
          // containing the GHSA ID as the last path segment), `severity`,
          // `name`, `title`.
          //
          // We match exceptions by GHSA ID (extracted from `url`), NOT by
          // `source` (numeric ID), because GHSA IDs are stable across npm
          // advisory database versions while numeric IDs are not.
          const vulns = report.vulnerabilities || {};
          const blocking = [];
          const excepted = [];

          function ghsaFromUrl(url) {
            if (!url || typeof url !== 'string') return null;
            const last = url.split('/').filter(Boolean).pop();
            return last && last.startsWith('GHSA-') ? last : null;
          }

          for (const [pkg, info] of Object.entries(vulns)) {
            const via = Array.isArray(info.via) ? info.via : [];
            for (const v of via) {
              if (typeof v === 'string') continue;
              const ghsa = ghsaFromUrl(v && v.url);
              if (!ghsa) continue;
              const entry = {
                pkg,
                ghsa,
                severity: v.severity,
                name: v.name,
                title: v.title,
                url: v.url,
              };
              if (exceptions.includes(ghsa)) {
                excepted.push(entry);
              } else {
                blocking.push(entry);
              }
            }
          }

          console.log('--- npm audit summary ---');
          console.log('Total advisories found:', excepted.length + blocking.length);
          console.log('Excepted (documented):', excepted.length);
          console.log('Blocking (must fix):   ', blocking.length);
          console.log('');

          if (excepted.length > 0) {
            console.log('Excepted advisories (see .github/npm-audit-exceptions.txt for rationale):');
            for (const e of excepted) {
              console.log(`  - ${e.pkg} ${e.ghsa} [${e.severity}] ${e.title} — ${e.url}`);
            }
            console.log('');
          }

          if (blocking.length > 0) {
            console.error('::error::Blocking npm audit advisories (high/critical, not excepted):');
            for (const b of blocking) {
              console.error(`  ::error::${b.pkg} ${b.ghsa} [${b.severity}] ${b.title} — ${b.url}`);
              console.error(`    Fix: upgrade ${b.pkg} to a patched version, or add ${b.ghsa} to .github/npm-audit-exceptions.txt with rationale.`);
            }
            process.exit(1);
          }

          console.log('::notice::npm audit passed — no unexcepted high/critical vulnerabilities.');
          NODE_SCRIPT

          echo "npm-audit gate passed."
