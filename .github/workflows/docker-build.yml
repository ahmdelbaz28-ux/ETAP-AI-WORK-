name: Docker Build Verification

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-engineering-service:
    name: Engineering Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build engineering service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.engineering-service
          push: false
          load: true
          tags: etap-engineering-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image
        run: |
          docker rm -f eng-test || true
          docker run --rm -d -p 8000:8000 --name eng-test \
            -e ENGINEERING_SERVICE_API_KEY=ci-test-key \
            etap-engineering-service:ci
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 http://localhost:8000/health >/dev/null 2>&1; then
              echo "health ready after ${i}x2s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Health check failed"; docker logs eng-test || true; exit 1
            fi
            sleep 2
          done
          curl -fsS --max-time 10 http://localhost:8000/ready || (echo "Ready check failed"; docker logs eng-test || true; exit 1)
      - name: Cleanup
        if: always()
        run: docker stop eng-test || true

  build-platform:
    name: Full Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: etap-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image
        run: |
          docker rm -f platform-test || true
          docker run --rm -d -p 8000:8000 --name platform-test \
            -e ENGINEERING_SERVICE_API_KEY=ci-test-key \
            etap-platform:ci
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 http://localhost:8000/health >/dev/null 2>&1; then
              echo "health ready after ${i}x2s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Health check failed"; docker logs platform-test || true; exit 1
            fi
            sleep 2
          done
      - name: Cleanup
        if: always()
        run: docker stop platform-test || true
