name: Docker Build Verification

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-engineering-service:
    name: Engineering Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build engineering service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.engineering-service
          push: false
          load: true
          tags: etap-engineering-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image health
        run: |
          docker run --rm -d -p 8000:8000 --name eng-test \
            -e ENGINEERING_SERVICE_API_KEY=ci-test-key \
            -e ENVIRONMENT=ci \
            -e ENGINEERING_SERVICE_CACHE_DISABLED=true \
            etap-engineering-service:ci
          # Poll up to 60s for the service to become healthy (cold container startup
          # on the CI runner can take >5s when downloading models or initialising DB)
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:8000/health 2>/dev/null; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" = "12" ]; then
              echo "Health check timed out after 60s"
              docker logs eng-test
              exit 1
            fi
            sleep 5
          done
          curl -fsS http://localhost:8000/ready || (echo "Ready check failed"; docker logs eng-test; exit 1)
          docker stop eng-test

  build-platform:
    name: Full Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: etap-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image health
        run: |
          docker run --rm -d -p 8000:8000 --name platform-test \
            -e ENGINEERING_SERVICE_API_KEY=ci-test-key \
            -e ENVIRONMENT=ci \
            -e ENGINEERING_SERVICE_CACHE_DISABLED=true \
            etap-platform:ci
          # Poll up to 60s for the service to become healthy
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:8000/health 2>/dev/null; then
              echo "Health check passed on attempt $i"
              break
            fi
            if [ "$i" = "12" ]; then
              echo "Health check timed out after 60s"
              docker logs platform-test
              exit 1
            fi
            sleep 5
          done
          docker stop platform-test
