# Automated release workflow
# Creates a new GitHub release when a tag is pushed
name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write  # Required to create GitHub releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      
      - name: Verify Release Gate Status (Fail-Closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking authoritative release gate status for commit ${{ github.sha }}..."
          STATUS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" --jq '.statuses[] | select(.context == "release-gate/authoritative") | .state' | head -n1)
          if [ "$STATUS" != "success" ]; then
            echo "::warning::Commit ${{ github.sha }} status is '${STATUS:-missing}'. Verifying direct CI status..."
            # Check if CI Success check-run passed for this commit
            CI_CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" --jq '.check_runs[] | select(.name == "CI Success") | .conclusion' | head -n1)
            if [ "$CI_CONCLUSION" != "success" ]; then
              echo "::error::Commit ${{ github.sha }} has not passed CI (conclusion: '${CI_CONCLUSION:-missing}'). Aborting release."
              exit 1
            fi
          fi
          echo "Release gate validation satisfied for commit ${{ github.sha }}."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1 --only-binary :all:
          pip install --only-binary :all: build==1.2.2.post1 twine==6.1.0  # NOSONAR: release tooling with pinned versions
          
      - name: Build package
        run: python -m build
          
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # SECURITY R7-C2: pinned to commit SHA of tag v2 — resolves S7637
        with:
          files: dist/**
          generate_release_notes: true
