# Automated release workflow
# Creates a new GitHub release when a tag is pushed
name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1 --only-binary :all:
          pip install --only-binary :all: build==1.2.2.post1 twine==6.1.0  # NOSONAR: release tooling with pinned versions
          
      - name: Build package
        run: python -m build
          
      - name: Create Release
        uses: softprops/action-gh-release@v2  # NOSONAR: GitHub Action pinning; SHA pinning in CI sprint
        with:
          files: dist/**
          generate_release_notes: true
