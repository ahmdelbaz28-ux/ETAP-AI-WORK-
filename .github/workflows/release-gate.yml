# .github/workflows/release-gate.yml
# AhmedETAP — Canonical Authoritative Release Gate
#
# Unified blocking gate that validates ALL required CI/CD workflows and security
# checks have passed for a specific commit SHA before production release or deployment.
#
# Fail-closed: If ANY required check is missing, pending, failed, or cancelled,
# this gate immediately fails with exit code 1.

name: Release Gate

on:
  workflow_run:
    workflows:
      - "CI"
      - "Security Scans"
      - "Docker Build & Validation"
      - "UI Quality & Security"
      - "UI Tests"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA to validate against canonical release criteria (default: current HEAD)"
        required: false
        default: ""
      shadow_mode:
        description: "Run in shadow / audit mode without failing workflow (reveals missing or skipped checks)"
        required: false
        default: "false"

concurrency:
  group: release-gate-${{ github.event.inputs.target_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write
  actions: read

jobs:
  authoritative-gate:
    name: Authoritative Release Gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - name: Resolve and Validate Target Commit SHA
        id: resolve-sha
        shell: bash
        env:
          INPUT_TARGET_SHA: ${{ github.event.inputs.target_sha }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          TARGET_SHA="$INPUT_TARGET_SHA"
          if [ -z "$TARGET_SHA" ]; then
            if [ "$EVENT_NAME" == "workflow_run" ]; then
              TARGET_SHA="$WORKFLOW_RUN_HEAD_SHA"
            else
              TARGET_SHA="$DEFAULT_SHA"
            fi
          fi

          echo "Target Commit SHA: $TARGET_SHA"
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid commit SHA format (must be 40 hex characters): $TARGET_SHA"
            exit 1
          fi

          if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Commit SHA does not exist in repository git history: $TARGET_SHA"
            exit 1
          fi

          echo "commit_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Evaluate Required Workflow Statuses (Fail-Closed)
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.resolve-sha.outputs.commit_sha }}
          IS_SHADOW: ${{ github.event.inputs.shadow_mode }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Evaluating Canonical Release Gate for Commit: $COMMIT_SHA"
          echo "Mode: $([ "$IS_SHADOW" = "true" ] && echo 'SHADOW / AUDIT' || echo 'AUTHORITATIVE BLOCKING')"
          echo "============================================================"

          # ── Deferred-gate guard (fail-closed hygiene) ─────────────────────
          # If this gate run was triggered by a workflow_run whose run did
          # NOT succeed (e.g. CI cancelled mid-flight by a newer push), the
          # target commit is superseded. Do NOT evaluate it and do NOT post
          # an authoritative commit status — CD only deploys on the posted
          # 'release-gate/authoritative' status, so this cannot be bypassed.
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$IS_SHADOW" != "true" ]; then
            TRIGGER_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            TRIGGER_NAME="${{ github.event.workflow_run.name }}"
            if [ "$TRIGGER_CONCLUSION" != "success" ]; then
              echo "::notice::Triggering workflow '$TRIGGER_NAME' concluded '$TRIGGER_CONCLUSION'. Release Gate deferred — no authoritative status posted. The head commit is evaluated by its own gate run."
              exit 0
            fi
          fi

          # ── Path-based applicability (Phase 18: prove N/A, never fake) ────
          # Docker Validation and UI Quality are path-filtered workflows.
          # If this commit does not touch their trigger paths, their
          # check-runs will never exist; a plain "missing = fail" rule would
          # fail every workflow-only commit. The gate therefore PROVES
          # non-applicability from the changed-file set and marks them N/A.
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r --root "$COMMIT_SHA" 2>/dev/null || true)
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(git diff --name-only "${COMMIT_SHA}^" "${COMMIT_SHA}" 2>/dev/null || true)
          fi
          echo "Changed files for this commit:"
          echo "$CHANGED_FILES" | sed 's/^/  /'

          DOCKER_TRIGGER_RE='^(Dockerfile|hf-space/Dockerfile|docker-compose|requirements.*\.txt|pyproject\.toml|\.github/workflows/docker-validation\.yml)'
          UI_TRIGGER_RE='^(ui/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ui-quality\.yml)'

          DOCKER_APPLICABLE=0
          UI_APPLICABLE=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if echo "$f" | grep -Eq "$DOCKER_TRIGGER_RE"; then DOCKER_APPLICABLE=1; fi
            if echo "$f" | grep -Eq "$UI_TRIGGER_RE"; then UI_APPLICABLE=1; fi
          done <<< "$CHANGED_FILES"
          echo "Docker Validation applicable: $DOCKER_APPLICABLE | UI Quality applicable: $UI_APPLICABLE"
          echo "============================================================"

          REQUIRED_CHECKS=(
            "CI Success"
            "gitleaks"
            "npm audit (high)"
            "Trivy Security Scan"
          )
          if [ "$DOCKER_APPLICABLE" -eq 1 ]; then
            REQUIRED_CHECKS+=("Docker Validation Summary")
          else
            echo "  [N/A] 'Docker Validation Summary' — commit does not touch Docker validation trigger paths."
          fi
          if [ "$UI_APPLICABLE" -eq 1 ]; then
            REQUIRED_CHECKS+=("UI Quality Summary")
          else
            echo "  [N/A] 'UI Quality Summary' — commit does not touch UI quality trigger paths."
          fi

          MAX_ATTEMPTS=60
          SLEEP_SECONDS=45
          ATTEMPT=1

          while true; do
            echo "Evaluating checks (attempt $ATTEMPT of $MAX_ATTEMPTS)..."
            CHECK_RUNS=$(gh api --paginate "repos/${REPO}/commits/${COMMIT_SHA}/check-runs" --jq '.check_runs[]' 2>/dev/null | jq -s '.' || echo "[]")

            GATE_FAILED=0
            ANY_PENDING=0

            for CHECK in "${REQUIRED_CHECKS[@]}"; do
              STATUS=$(echo "$CHECK_RUNS" | jq -r --arg name "$CHECK" '.[] | select(.name == $name) | .status' | head -n1)
              CONCLUSION=$(echo "$CHECK_RUNS" | jq -r --arg name "$CHECK" '.[] | select(.name == $name) | .conclusion' | head -n1)

              if [ -z "$STATUS" ] || [ "$STATUS" == "null" ]; then
                echo "  [MISSING] Required check '$CHECK' not found yet."
                ANY_PENDING=1
              elif [ "$STATUS" != "completed" ]; then
                echo "  [PENDING] Required check '$CHECK' is in status '$STATUS'."
                ANY_PENDING=1
              elif [ "$CONCLUSION" != "success" ]; then
                echo "::error::[FAILED] Required check '$CHECK' finished with conclusion '$CONCLUSION' (fail-closed)."
                GATE_FAILED=1
              else
                echo "  [PASSED] $CHECK -> completed / success"
              fi
            done

            if [ "$GATE_FAILED" -ne 0 ]; then
              echo "============================================================"
              if [ "$IS_SHADOW" = "true" ]; then
                echo "::warning::[SHADOW MODE] Release Gate detected failures or skipped checks above, but shadow mode is enabled."
                echo "============================================================"
                exit 0
              else
                echo "::error::Release Gate FAILED. One or more mandatory checks failed."
                echo "============================================================"
                exit 1
              fi
            fi

            if [ "$ANY_PENDING" -eq 0 ]; then
              echo "All required checks have completed successfully!"
              break
            fi

            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Timed out waiting for required checks to complete after $(( MAX_ATTEMPTS * SLEEP_SECONDS )) seconds."
              if [ "$IS_SHADOW" = "true" ]; then
                exit 0
              else
                exit 1
              fi
            fi

            echo "One or more checks still pending/missing. Sleeping ${SLEEP_SECONDS}s before re-evaluating..."
            sleep "$SLEEP_SECONDS"
            ATTEMPT=$(( ATTEMPT + 1 ))
          done

          if [ "$IS_SHADOW" = "true" ]; then
            echo "============================================================"
            echo "All canonical release criteria verified successfully (SHADOW MODE)."
            echo "Shadow mode is active — skipping authoritative status post."
            echo "============================================================"
            exit 0
          fi

          echo "============================================================"
          echo "All canonical release criteria verified successfully!"
          echo "Posting authoritative release status to GitHub commit..."
          echo "============================================================"

          gh api "repos/${REPO}/statuses/${COMMIT_SHA}" \
            -f state="success" \
            -f context="release-gate/authoritative" \
            -f description="All canonical quality, security, container, and test gates passed." \
            -f target_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          echo "Authoritative release gate status posted successfully."
