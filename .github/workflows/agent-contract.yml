name: Agent Contract Validation
on: [push, pull_request]
jobs:
  agent-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (node24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e . pytest
      - name: Verify Python agents implement BaseAgent contract
        run: |
          python -c "
          from agents.registry import create_agent_registry
          from agents.models import StudyType
          from agents.base import BaseAgent
          import inspect

          registry = create_agent_registry()
          errors = []

          # Check all registered agents
          for key, agent in registry.items():
              if not isinstance(agent, BaseAgent):
                  errors.append(f'TYPE: {key} not BaseAgent subclass')
              sig = inspect.signature(agent.execute)
              if 'task' not in sig.parameters:
                  errors.append(f'SIGNATURE: {key}.execute() missing task param')
              if not hasattr(agent, 'validate_result'):
                  errors.append(f'METHOD: {key} missing validate_result()')

          # Check StudyType coverage (informational)
          registered_studies = {type(a).__name__.replace('Agent','').upper() for a in registry.values()}
          for st in StudyType:
              if st.name not in registered_studies and st.name not in ('ETAP_EXPERT', 'ETAP_GUI', 'DIGITAL_TWIN'):
                  print(f'INFO: No Python agent for {st.name}')

          if errors:
              print('\\n'.join(errors))
              exit(1)
          print(f'OK: {len(registry)} Python agents comply with BaseAgent contract')
          "
