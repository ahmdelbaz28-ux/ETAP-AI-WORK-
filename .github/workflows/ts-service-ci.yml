# =============================================================================
# CI Pipeline — Full 8-Gate Quality Pipeline for TS Service
# Per ci-cd-and-automation skill: every change goes through these gates
# before merge. No gate can be skipped.
# =============================================================================
name: TS Service CI

on:
  pull_request:
    paths:
      - 'ts-service/**'
    branches: [main]
  push:
    paths:
      - 'ts-service/**'
    branches: [main]

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ts-service

jobs:
  # ── Gate 1: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ts-service/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  # ── Gate 2: Type Check ───────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ts-service/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Type check
        run: npm run typecheck

  # ── Gate 3: Tests with Coverage ─────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ts-service/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run all tests with coverage
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: ts-service/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Gate 4: Build ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ts-service/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ts-service/dist/
          retention-days: 3

  # ── Gate 5: E2E Tests (optional) ────────────────────────────────────────
  # Skipped until Playwright is configured. Uncomment when ready.
  # e2e-tests:
  #   name: E2E Tests
  #   runs-on: ubuntu-latest
  #   needs: [build]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v7
  #       with:
  #         node-version: '22'
  #         cache: 'npm'
  #         cache-dependency-path: ts-service/package-lock.json
  #     - run: npm ci
  #     - name: Install Playwright
  #       run: npx playwright install --with-deps chromium
  #     - name: Build
  #       run: npm run build
  #     - name: Run E2E tests
  #       run: npx playwright test
  #     - uses: actions/upload-artifact@v4
  #       if: failure()
  #       with:
  #         name: playwright-report
  #         path: ts-service/playwright-report/

  # ── Gate 7: Security Audit ───────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ts-service/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Secrets scan
        run: |
          # Check for hardcoded secrets in source
          SECRETS_FOUND=0

          # AWS keys
          if grep -rn 'AKIA[0-9A-Z]\{16\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::AWS Access Key found in source code"
            SECRETS_FOUND=1
          fi

          # OpenAI keys
          if grep -rn 'sk-[a-zA-Z0-9]\{20,\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::OpenAI API key found in source code"
            SECRETS_FOUND=1
          fi

          # GitHub tokens
          if grep -rn 'ghp_[a-zA-Z0-9]\{36\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::GitHub token found in source code"
            SECRETS_FOUND=1
          fi

          # GitHub PAT tokens
          if grep -rn 'github_pat_[a-zA-Z0-9_]\{20,\}' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::GitHub PAT token found in source code"
            SECRETS_FOUND=1
          fi

          # Hardcoded passwords
          if grep -rn 'password\s*=\s*"[^"]\+"' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::Hardcoded password found in source code"
            SECRETS_FOUND=1
          fi

          # Private keys
          if grep -rn 'BEGIN.*PRIVATE KEY' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::Private key found in source code"
            SECRETS_FOUND=1
          fi

          # JWT secrets hardcoded
          if grep -rn 'jwtSecret\s*=\s*"[^"]\+"' src/ --include="*.ts" --include="*.js" 2>/dev/null; then
            echo "::error::Hardcoded JWT secret found in source code"
            SECRETS_FOUND=1
          fi

          if [ "$SECRETS_FOUND" -eq 1 ]; then
            echo "::error::Secrets detected in source code — remove them and use environment variables"
            exit 1
          fi

          echo "No secrets found in source code"

  # ── Gate 8: Bundle Size Check ────────────────────────────────────────────
  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ts-service/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: npm run bundlesize

  # ── Summary ──────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, typecheck, tests, security-audit, bundle-size]
    if: always()
    steps:
      - name: Check all gates passed
        working-directory: ${{ github.workspace }}
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.typecheck.result }}" == "success" && \
                "${{ needs.tests.result }}" == "success" && \
                "${{ needs.security-audit.result }}" == "success" && \
                "${{ needs.bundle-size.result }}" == "success" ]]; then
            echo "All quality gates passed"
            exit 0
          else
            echo "One or more quality gates failed"
            echo "Lint: ${{ needs.lint.result }}"
            echo "TypeCheck: ${{ needs.typecheck.result }}"
            echo "Tests: ${{ needs.tests.result }}"
            echo "Security: ${{ needs.security-audit.result }}"
            echo "Bundle Size: ${{ needs.bundle-size.result }}"
            exit 1
          fi
