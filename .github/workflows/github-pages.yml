# Deploy documentation with MkDocs to GitHub Pages
name: Docs (MkDocs) Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force redeploy"
        required: false
        default: false
        type: boolean

# Required: allow github-actions[bot] to deploy Pages and write to repo
permissions:
  contents: write
  pages: write
  id-token: write

# Avoid concurrent deploys racing
concurrency:
  group: mkdocs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip==25.0.1 --only-binary :all:
          pip install --only-binary :all: mkdocs==1.6.1 mkdocs-material==9.6.11

      - name: Verify Documentation Metadata & Assets
        run: |
          python scripts/check_metadata.py
          python scripts/verify_assets.py
          python scripts/gen_api_ref.py --check

      - name: Build documentation site
        run: mkdocs build -f docs/mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

      - name: Sync gh-pages branch (backup archive)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdocs gh-deploy --force -f docs/mkdocs.yml \
            --message "Deployed ${GITHUB_SHA::7} with MkDocs [skip vercel]"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
