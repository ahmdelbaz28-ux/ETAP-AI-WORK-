# Deploy documentation with MkDocs to GitHub Pages
name: Docs (MkDocs) Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force redeploy"
        required: false
        default: "false"
        type: boolean

# Required: allow github-actions[bot] to deploy Pages and write to repo
permissions:
  contents: write
  pages: write
  id-token: write

# Avoid concurrent deploys racing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install MkDocs and theme
        run: |
          pip install --upgrade pip==25.0.1 --only-binary :all:
          pip install --only-binary :all: mkdocs==1.6.1 mkdocs-material==9.6.11

      - name: Build documentation
        run: mkdocs build -f docs/mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Sync gh-pages branch (backup archive)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdocs gh-deploy --force -f docs/mkdocs.yml \
            --message "Deployed ${GITHUB_SHA::7} with MkDocs [skip vercel]"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
