name: "CD — Deploy (gated on Release Gate)"

on:
  workflow_run:
    workflows: ["Release Gate"]          # Canonical authoritative release gate
    types: [completed]
    branches: [main]
  workflow_dispatch:            # Manual deployment / rollback path, confirmed by pinned SHA
    inputs:
      ref_sha:
        description: "Deploy this exact commit SHA (must be a green Release Gate run)"
        required: true
        type: string

concurrency:
  group: cd-production          # Single deployment at a time, never cancel mid-flight
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      - name: Verify Release Gate success + SHA pinning
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.ref_sha }}"
            if ! echo "$SHA" | grep -qE '^[0-9a-fA-F]{40}$'; then
              echo "::error::ref_sha must be a full 40-character hexadecimal SHA. Received: $SHA"
              exit 1
            fi
            if ! git cat-file -e "$SHA^{commit}"; then
              echo "::error::Commit $SHA does not exist in repository history."
              exit 1
            fi
            CI_CONCLUSION=$(gh run list --commit "$SHA" --workflow "CI" --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
            if [ "$CI_CONCLUSION" != "success" ]; then
              echo "::error::Commit $SHA does not have a successful CI run (conclusion: '$CI_CONCLUSION'). Refusing to deploy."
              exit 1
            fi
          # ── Canonical contract: the ONLY deploy authority is the
          # 'release-gate/authoritative' commit status posted by the
          # Release Gate after a real, fail-closed evaluation. Workflow
          # conclusions alone are NOT trusted (an early-exit/deferred gate
          # never posts the status, so it cannot enable a deployment).
            RG_STATUS=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" \
              --jq '.statuses[] | select(.context == "release-gate/authoritative") | .state' 2>/dev/null | head -n1 || echo "")
            if [ "$RG_STATUS" != "success" ]; then
              echo "::error::Commit $SHA has no authoritative 'release-gate/authoritative' status = success (found: '$RG_STATUS'). Refusing to deploy."
              exit 1
            fi
            echo "Authoritative Release Gate status verified for $SHA."
          else
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::error::Release Gate did not succeed — refusing to deploy"; exit 1
            fi
            if [ "${{ github.event.workflow_run.head_repository.full_name }}" != "${{ github.repository }}" ]; then
              echo "::error::Release Gate ran on a fork — refusing to deploy"; exit 1
            fi
            SHA="${{ github.event.workflow_run.head_sha }}"
            RG_STATUS=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" \
              --jq '.statuses[] | select(.context == "release-gate/authoritative") | .state' 2>/dev/null | head -n1 || echo "")
            if [ "$RG_STATUS" != "success" ]; then
              echo "::error::Commit $SHA has no authoritative 'release-gate/authoritative' status = success (found: '$RG_STATUS'). Refusing to deploy."
              exit 1
            fi
            echo "Authoritative Release Gate status verified for $SHA."
          fi
          echo "Deploying pinned SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  validate-secrets:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail fast on missing deploy secrets (NO silent no-ops per FIX-19)
        run: |
          set -euo pipefail
          missing=0
          for s in HF_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!s:-}" ]; then
              echo "::error::Missing deployment secret: $s"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "::error::NOT DEPLOYED — Required secrets are missing."
            exit 1
          fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  build-ui:
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: "${{ needs.guard.outputs.sha }}"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Build UI
        run: pnpm build
        working-directory: ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ui-dist
          path: ui/dist

  deploy-hf:
    needs: [guard, validate-secrets, build-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      hf_sha: ${{ steps.push.outputs.hf_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: "${{ needs.guard.outputs.sha }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (node24)
        with:
          name: ui-dist
          path: ui-dist

      - name: Stage THE 25-item production whitelist (FIX-0.1 / FIX-17)
        run: |
          set -euo pipefail
          mkdir -p stage
          # 1) HF frontmatter README (renamed on the Space)
          test -f README.hf.md   || { echo "README.hf.md missing";   exit 1; }
          test -f Dockerfile     || { echo "Dockerfile missing";     exit 1; }
          test -f hf-space/app.py || { echo "hf-space/app.py missing"; exit 1; }
          test -f ui-dist/index.html || { echo "ui-dist/index.html missing — UI build failed"; exit 1; }
          cp README.hf.md stage/README.md
          # 2) root files (7)
          cp -r Dockerfile .dockerignore VERSION prompts.json compat.py alembic.ini migrations stage/
          echo "${{ needs.guard.outputs.sha }}" > stage/DEPLOY_SHA
          # 3) the whole hf-space/ dir (app.py + requirements.hf.txt + README.md)
          cp -r hf-space stage/
          # 4) the 16 runtime code dirs
          cp -r agents prompts core_model core engine stage/
          cp -r load_flow fault_analysis coordination relays contingency motor_starting stage/
          cp -r network_solver services api utils ai_context_engine stage/
          cp -r integrations ml stage/
          # 7 مجلدات كانت مفقودة (RC-3 fix): curves visualization reporting digital_twin security gis_integration adms_control
          cp -r curves visualization reporting digital_twin security gis_integration adms_control stage/
          # 5) data/ minus runtime DBs
          cp -r data stage/
          rm -f stage/data/*.db* 2>/dev/null || true
          # 6) the FRESH UI build from this exact SHA
          cp -r ui-dist stage/
          # NOTE: skills/ is intentionally NOT shipped (HF file-size limit;
          # agents load skills from the GitHub repo, per sync-platforms.yml:175-180)

      - name: Drift-check — every Dockerfile COPY source must be staged (FIX-17 2.0 gate)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, os, sys

          with open("Dockerfile", encoding="utf-8") as f:
              content = f.read()

          # استخرج مصادر COPY بدقة — أزل كل --flags قبل التحليل
          sources = set()
          for line in content.splitlines():
              line = line.strip()
              if not line.upper().startswith("COPY"):
                  continue
              # أزل كل --flag=value أو --flag value
              cleaned = re.sub(r'--\S+', '', line).split()
              # cleaned[0]=COPY، cleaned[1:-1]=sources، cleaned[-1]=dest
              if len(cleaned) >= 3:
                  for src in cleaned[1:-1]:
                      src = src.rstrip('/')
                      if not src.startswith('/'):
                          sources.add(os.path.basename(src))

          # استثناءات: مصادر تُعالَج بشكل مختلف
          exempt = {'requirements.hf.txt', 'app.py', 'ui-dist', 'DEPLOY_SHA', 'DEPLOY_SHA*'}

          missing = []
          for base in sorted(sources):
              clean_base = base.rstrip('*')
              if base in exempt or clean_base in exempt:
                  continue
              if not os.path.exists(f"stage/{base}") and not os.path.exists(f"stage/{clean_base}"):
                  missing.append(base)
                  print(f"::error::Dockerfile COPY source '{base}' missing from cd.yml stage")

          if missing:
              sys.exit(1)
          print(f"Drift check passed — {len(sources)} sources all present in stage/")
          PYEOF

      - name: Push staged set to HF Space (single atomic commit)
        id: push
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/.git-credentials-hf' EXIT ERR
          echo "https://user:${HF_TOKEN}@huggingface.co" > /tmp/.git-credentials-hf
          git config --global credential.helper "store --file=/tmp/.git-credentials-hf"
          git clone https://huggingface.co/spaces/ahmdelbaz28/AhmedETAP-Platform space-repo 2>&1 | tail -3
          cd space-repo
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -not -name '.gitattributes' -exec rm -rf {} +
          cp -r ../stage/. ./
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy ${{ needs.guard.outputs.sha }}"
            git push origin main 2>&1 | tee /tmp/hf-push.log
            if grep -q "remote rejected\|failed to push" /tmp/hf-push.log; then
              echo "::error::HF Space push FAILED"
              exit 1
            fi
            echo "HF Space updated and pushed successfully."
          else
            echo "No changes detected — HF Space is already up to date with this deployment."
          fi
          HF_COMMIT=$(git rev-parse HEAD)
          echo "hf_sha=$HF_COMMIT" >> "$GITHUB_OUTPUT"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  deploy-vercel:
    needs: [guard, validate-secrets, build-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: "${{ needs.guard.outputs.sha }}"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Deploy (strict — failures must fail the run)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx vercel@59.25.0 pull --yes --environment=production
          npx vercel@59.25.0 build --prod
          npx vercel@59.25.0 deploy --prebuilt --prod

  smoke-and-health-gate:
    needs: [guard, deploy-hf, deploy-vercel]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Smoke the EXACT deployed revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WANT_SHA: ${{ needs.guard.outputs.sha }}
          HF_SHA: ${{ needs.deploy-hf.outputs.hf_sha }}
        run: |
          set -euo pipefail
          SHA="${{ needs.guard.outputs.sha }}"
          # 1) Real app health probe (/healthz endpoint)
          HEALTHY_HF=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://ahmdelbaz28-ahmedetap-platform.hf.space/healthz || true)
            if [ "$code" = "200" ]; then
              echo "HF Space healthz OK"
              HEALTHY_HF=1
              break
            fi
            echo "attempt $i: /healthz -> $code"; sleep 10
          done
          if [ "$HEALTHY_HF" -ne 1 ]; then
            echo "::error::HF Space health check failed after 30 attempts"
            exit 1
          fi

          # 2) Authoritative Forensic SHA Check via /version endpoint (Fail-Closed)
          python3 - <<'PY'
          import os, sys, urllib.request, json, time

          want_sha = os.environ["WANT_SHA"].strip()
          hf_sha = os.environ.get("HF_SHA", "").strip()
          print(f"Starting forensic identity verification: WANT_SHA={want_sha} (HF commit={hf_sha})")

          # Check HF Space runtime metadata if token provided
          if os.environ.get("HF_TOKEN"):
              try:
                  req = urllib.request.Request(
                      "https://huggingface.co/api/spaces/ahmdelbaz28/AhmedETAP-Platform",
                      headers={"Authorization": "Bearer " + os.environ["HF_TOKEN"]})
                  meta = json.load(urllib.request.urlopen(req))
                  deployed = (meta.get("runtime") or {}).get("sha") or ""
                  print(f"HF Space runtime.sha={deployed}")
              except Exception as exc:
                  print(f"Notice: Space runtime metadata query: {exc}")

          url = "https://ahmdelbaz28-ahmedetap-platform.hf.space/version"
          matched = False
          reported_sha = "unknown"

          for attempt in range(1, 31):
              try:
                  v_req = urllib.request.Request(url, headers={"User-Agent": "AhmedETAP-CI-Smoke"})
                  with urllib.request.urlopen(v_req, timeout=10) as v_resp:
                      if v_resp.getcode() == 200:
                          v_data = json.load(v_resp)
                          reported_sha = (v_data.get("commit_sha") or "unknown").strip()
                          print(f"Attempt {attempt}: /version returned commit_sha='{reported_sha}'")
                          if reported_sha == want_sha:
                              matched = True
                              print(f"✓ Forensic check PASSED: Deployed /version matches WANT_SHA ({reported_sha})")
                              break
              except Exception as exc:
                  print(f"Attempt {attempt}: /version probe notice: {exc}")
              time.sleep(5)

          if not matched:
              sys.stderr.write(
                  f"::error::Forensic SHA mismatch: Deployed commit_sha '{reported_sha}' "
                  f"does not match expected WANT_SHA '{want_sha}' after 30 attempts!\n"
              )
              sys.exit(1)
          PY

          # 3) Real Vercel app probe (Production domain)
          echo "Probing Vercel production deployment..."
          HEALTHY_VERCEL=0
          for i in $(seq 1 20); do
            vcode=$(curl -s -o /dev/null -w '%{http_code}' https://etap-ai-work.vercel.app || true)
            if [ "$vcode" = "200" ]; then
              echo "Vercel production health OK"
              HEALTHY_VERCEL=1
              break
            fi
            echo "attempt $i: Vercel -> $vcode"; sleep 5
          done
          if [ "$HEALTHY_VERCEL" -ne 1 ]; then
            echo "::error::Vercel health check failed after 20 attempts"
            exit 1
          fi

      - name: Update LKGS Tag (Last Known Good State)
        env:
          GH_TOKEN: ${{ github.token }}
          LKGS_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          echo "Updating LKGS tag 'lkgs-latest' to verified production commit $LKGS_SHA..."
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/lkgs-latest" \
            -f sha="$LKGS_SHA" 2>/dev/null || \
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/lkgs-latest" \
            -f sha="$LKGS_SHA" -F force=true
          echo "LKGS tag 'lkgs-latest' successfully updated."

  deployment-failure-recovery:
    name: "📢 Deployment Failure & Recovery Guide"
    needs: [guard, smoke-and-health-gate]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Page + pin back (SP-6)
        env:
          ALERT_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_SHA: ${{ needs.guard.outputs.sha }}
        run: |
          echo "::error::Deploy failed health gate. ACTION: trigger rollback.yml or re-run cd.yml with the last green SHA."
          if [ -n "$ALERT_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"ETAP CD FAILED health gate at ${DEPLOY_SHA:-unknown} — rollback required\"}" \
              "$ALERT_WEBHOOK" || true
          fi

