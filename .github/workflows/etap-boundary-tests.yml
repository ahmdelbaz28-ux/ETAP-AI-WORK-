# Boundary mismatch tests — detect API ↔ frontend type drift
name: ETAP Boundary Mismatch Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - 'ui/src/**'
      - 'tests/**'
      - '.github/workflows/etap-boundary-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'ui/src/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundary-tests:
    name: API ↔ Frontend Type Drift Detection
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          # E4 fix: pytest-asyncio and aiofiles required for async fixtures in boundary tests
          pip install --quiet pytest pyyaml pytest-asyncio aiofiles

      - name: Run boundary mismatch tests
        run: |
          set -euo pipefail
          python -m pytest tests/boundary_mismatch/ -v --tb=short -s 2>&1 | tee boundary-test-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-test-results
          path: boundary-test-results.txt
