name: "Meta-Guard Anti-Greenwash & Fail-Closed Gate"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'CI_GATE_EXCEPTIONS.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'CI_GATE_EXCEPTIONS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anti-greenwash-audit:
    name: "🛡️ Meta-Guard Workflow Audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Run Meta-Guard Anti-Greenwash Auditor
        run: |
          set -euo pipefail
          python3 scripts/ci_anti_greenwash_guard.py
