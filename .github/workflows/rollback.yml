name: "Production Rollback"

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Git commit SHA to roll back to (must be 40 hex characters from a prior green CI run)"
        required: true
        type: string
      reason:
        description: "Reason / Incident ID for initiating rollback"
        required: true
        type: string

concurrency:
  group: production-rollback
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: "Validate Rollback Request"
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.check.outputs.target_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - name: Verify Target SHA and CI Status
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.inputs.target_sha }}"
          REASON="${{ github.event.inputs.reason }}"
          echo "Rollback initiated by: ${{ github.actor }}"
          echo "Reason: $REASON"

          if ! echo "$SHA" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "::error::target_sha must be a full 40-character hexadecimal SHA. Received: $SHA"
            exit 1
          fi

          if ! git cat-file -e "$SHA^{commit}"; then
            echo "::error::Commit $SHA does not exist in repository history."
            exit 1
          fi

          # Verify CI or Release Gate passed for target SHA
          CI_CONCLUSION=$(gh run list --commit "$SHA" --workflow "CI" --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
          RELEASE_GATE_STATUS=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" --jq '.statuses[] | select(.context == "release-gate/authoritative") | .state' 2>/dev/null | head -n1 || echo "")
          if [ "$RELEASE_GATE_STATUS" != "success" ] && [ "$CI_CONCLUSION" != "success" ]; then
            echo "::error::Commit $SHA does not have a verified green CI or Release Gate run (CI: '$CI_CONCLUSION', Release Gate: '$RELEASE_GATE_STATUS'). Refusing rollback."
            exit 1
          fi

          echo "Target commit verified (CI: '${CI_CONCLUSION:-n/a}', Release Gate: '${RELEASE_GATE_STATUS:-n/a}'): $(git log -1 --oneline "$SHA")"
          echo "target_sha=$SHA" >> "$GITHUB_OUTPUT"

  dispatch-cd:
    name: "Dispatch CD Pipeline with Target SHA"
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cd.yml with target SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          echo "Triggering cd.yml with ref_sha=$TARGET_SHA..."
          gh workflow run cd.yml -f ref_sha="$TARGET_SHA"
          
          echo "Waiting for cd.yml execution to start..."
          sleep 5
          RUN_ID=$(gh run list --workflow=cd.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "Dispatched Run ID: $RUN_ID"
          
          echo "Watching deployment progress..."
          gh run watch "$RUN_ID"
          
          CONCLUSION=$(gh run view "$RUN_ID" --json conclusion -q '.conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::cd.yml rollback run failed with conclusion: $CONCLUSION"
            exit 1
          fi
          echo "cd.yml deployment completed successfully."

  verify-rollback:
    name: "Verify Production Health Post-Rollback"
    needs: [validate, dispatch-cd]
    runs-on: ubuntu-latest
    steps:
      - name: Probe HF Space /healthz and runtime SHA
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WANT_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          # 1) Verify runtime SHA on HuggingFace Space
          python - <<'PY'
          import os, sys, urllib.request, json
          token = os.environ.get("HF_TOKEN", "")
          headers = {"Authorization": "Bearer " + token} if token else {}
          req = urllib.request.Request(
              "https://huggingface.co/api/spaces/ahmdelbaz28/AhmedETAP-Platform",
              headers=headers
          )
          try:
              meta = json.load(urllib.request.urlopen(req))
              deployed = (meta.get("runtime") or {}).get("sha") or ""
              want = os.environ["WANT_SHA"]
              print(f"Space deployed SHA={deployed}, target want={want}")
              if want[:7] not in deployed:
                  print("WARNING: HF Space runtime metadata may still be updating...")
          except Exception as e:
              print(f"Notice: Space metadata check note: {e}")
          PY

          # 2) Health probe on real app /healthz
          echo "Probing /healthz..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://ahmdelbaz28-ahmedetap-platform.hf.space/healthz || true)
            if [ "$code" = "200" ]; then
              echo "Production /healthz is healthy (HTTP 200) after ${i}0s."
              exit 0
            fi
            echo "Attempt $i: /healthz -> $code. Retrying in 10s..."
            sleep 10
          done
          echo "::error::Production /healthz failed to respond with 200 within 5 minutes"
          exit 1

  notify:
    name: "Notify Rollback Status"
    needs: [validate, verify-rollback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Alert Webhook
        env:
          ALERT_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          STATUS: ${{ needs.verify-rollback.result }}
          REASON: ${{ github.event.inputs.reason }}
          OPERATOR: ${{ github.actor }}
        run: |
          if [ -n "$ALERT_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"[ AhmedETAP Rollback ] Status: $STATUS | SHA: $TARGET_SHA | Operator: $OPERATOR | Reason: $REASON\"}" \
              "$ALERT_WEBHOOK" || true
          fi
