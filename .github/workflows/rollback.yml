# Deployment Rollback
# ─────────────────────────────────────────────────────────────────────────────
# Implements the "Rollback Plan" section of the ci-cd-and-automation skill
# (SKILL.md → Deployment Strategies → Rollback Plan → "Every deployment should
# be reversible").
#
# This is a manual-trigger (workflow_dispatch) workflow that operators run
# when a production deployment needs to be reverted. It supports two
# deployment targets, matching the deploy jobs in ci-cd.yml:
#   1. Vercel — uses `vercel rollback <deployment-url>` (Vercel CLI)
#   2. HF Space — rolls the HF Space repo back to a prior git SHA, which
#      sync-platforms.yml then redeploys.
#
# Safety features:
#   - Manual trigger only (no auto-rollback — false positives cause outages).
#   - Each target is opt-in via the `target` input.
#   - Requires production environment approval (GitHub environment gate).
#   - Prints the current deployment metadata before rolling back, so the
#     operator can verify they are rolling back to the correct version.
#   - Runs a post-rollback health check before declaring success.
# ─────────────────────────────────────────────────────────────────────────────
name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which deployment target to roll back'
        required: true
        type: choice
        default: 'vercel'
        options:
          - vercel
          - hf
          - both
      vercel_deployment_url:
        description: 'Vercel deployment URL to roll back to (e.g. etap-ai-work-abc123-ahmdelbaz28.vercel.app). Required if target includes vercel.'
        required: false
        type: string
      git_sha:
        description: 'Git SHA to redeploy on HF Space (full 40-char SHA). Required if target includes hf. Use the SHA of the last known-good commit.'
        required: false
        type: string
      skip_health_check:
        description: 'Skip the post-rollback health check (use only if the health endpoint is known to be down).'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialize rollbacks — concurrent rollbacks on the same target cause
# race conditions and make recovery harder.
concurrency:
  group: rollback-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  # ── 1. VALIDATE INPUTS ──────────────────────────────────────────────────────
  validate:
    name: Validate rollback inputs
    runs-on: ubuntu-latest
    outputs:
      do_vercel: ${{ steps.decide.outputs.do_vercel }}
      do_hf: ${{ steps.decide.outputs.do_hf }}
    steps:
      - name: Validate inputs
        id: decide
        run: |
          set -euo pipefail
          target='${{ github.event.inputs.target }}'
          vercel_url='${{ github.event.inputs.vercel_deployment_url }}'
          git_sha='${{ github.event.inputs.git_sha }}'

          do_vercel=false
          do_hf=false
          case "$target" in
            vercel) do_vercel=true ;;
            hf)     do_hf=true ;;
            both)   do_vercel=true; do_hf=true ;;
            *) echo "::error::Invalid target: $target"; exit 2 ;;
          esac

          if [ "$do_vercel" = "true" ] && [ -z "$vercel_url" ]; then
            echo "::error::vercel_deployment_url is required when target includes vercel."
            echo "Find the URL of the last known-good deployment at:"
            echo "  https://vercel.com/ahmdelbaz28-uxs-projects/etap-ai-work/deployments"
            exit 2
          fi

          if [ "$do_hf" = "true" ]; then
            if [ -z "$git_sha" ]; then
              echo "::error::git_sha is required when target includes hf."
              echo "Find the SHA of the last known-good commit at:"
              echo "  https://github.com/${{ github.repository }}/commits/main"
              exit 2
            fi
            if ! echo "$git_sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::git_sha must be a full 40-character SHA. Got: $git_sha"
              exit 2
            fi
          fi

          echo "do_vercel=$do_vercel" >> "$GITHUB_OUTPUT"
          echo "do_hf=$do_hf"     >> "$GITHUB_OUTPUT"
          echo "::notice::Rollback plan — Vercel: $do_vercel, HF: $do_hf"

  # ── 2. VERCEL ROLLBACK ──────────────────────────────────────────────────────
  rollback-vercel:
    name: ▲ Rollback Vercel
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.do_vercel == 'true'
    environment:
      # GitHub environment gate — requires manual approval if reviewers
      # are configured. Per the skill: production deployments need a
      # rollback mechanism, and triggering that mechanism should require
      # explicit authorization.
      name: production-vercel
      url: ${{ github.event.inputs.vercel_deployment_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Vercel CLI
        # Pin Vercel CLI to the same version used by ci-cd.yml's deploy-vercel
        # job to avoid version-skew bugs in the rollback API.
        run: npm install -g --ignore-scripts vercel@37.2.3

      - name: Verify target deployment exists
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_URL: ${{ github.event.inputs.vercel_deployment_url }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set — cannot authenticate to Vercel."
            exit 2
          fi
          echo "Inspecting target deployment: $TARGET_URL"
          # `vercel inspect` returns non-zero if the deployment doesn't exist
          # or the token lacks access. We treat that as a hard stop — never
          # roll back to a deployment we can't verify.
          vercel inspect "$TARGET_URL" --token "$VERCEL_TOKEN" \
            || { echo "::error::Target deployment not found or inaccessible: $TARGET_URL"; exit 2; }
          echo "::notice::Target deployment verified."

      - name: Promote target deployment to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_URL: ${{ github.event.inputs.vercel_deployment_url }}
        run: |
          set -euo pipefail
          echo "Rolling production alias to: $TARGET_URL"
          # `vercel alias` re-points the production alias to the target
          # deployment. This is the canonical Vercel rollback mechanism
          # and is instantaneous (no rebuild).
          vercel alias "$TARGET_URL" "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN" \
            || { echo "::error::Vercel alias failed."; exit 1; }
          echo "::notice::Vercel production alias now points to $TARGET_URL"

  # ── 3. HF SPACE ROLLBACK ────────────────────────────────────────────────────
  rollback-hf:
    name: 🤗 Rollback HF Space
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.do_hf == 'true'
    environment:
      name: production-hf
      url: https://huggingface.co/spaces/ahmdelbaz28/AhmedETAP-Platform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install huggingface_hub
        # Pin to the same version used by ci-cd.yml's deploy-hf job.
        run: 'pip install --only-binary :all: huggingface_hub==0.26.5'

      - name: Verify target commit exists in repo
        env:
          TARGET_SHA: ${{ github.event.inputs.git_sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$TARGET_SHA^{commit}"; then
            echo "::error::Commit $TARGET_SHA does not exist in the repository."
            echo "The SHA must be reachable from the default branch."
            exit 2
          fi
          echo "::notice::Target commit verified: $TARGET_SHA"
          git log --oneline -1 "$TARGET_SHA"

      - name: Sync target commit to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_SHA: ${{ github.event.inputs.git_sha }}
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set — cannot authenticate to HF Space."
            exit 2
          fi
          python - <<'EOF'
          import os
          import subprocess
          from huggingface_hub import HfApi, upload_folder

          token = os.environ["HF_TOKEN"]
          target_sha = os.environ["TARGET_SHA"]
          repo_id = "ahmdelbaz28/AhmedETAP-Platform"
          api = HfApi(token=token)

          # Checkout the target commit so we sync exactly that state.
          subprocess.check_call(["git", "checkout", "--detach", target_sha])

          # Build the UI from the target commit so the HF Space gets the
          # same UI bundle that was deployed at that point in time.
          print("::notice::Building UI from target commit")
          subprocess.check_call(
              ["npm", "ci", "--ignore-scripts"],
              cwd="ui",
          )
          subprocess.check_call(
              ["npm", "run", "build"],
              cwd="ui",
          )

          # Sync the repo content (excluding node_modules, .git, etc.) to
          # HF Space. The HF Space Docker image rebuilds automatically
          # after the push.
          print(f"::notice::Uploading commit {target_sha} to HF Space {repo_id}")
          upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=".",
              token=token,
              ignore_patterns=[
                  "node_modules/*",
                  "ui/node_modules/*",
                  ".git/*",
                  ".github/*",
                  "tests/*",
                  "__pycache__/*",
                  "*.pyc",
                  "reports/*",
                  "terraform/*",
                  ".venv/*",
                  "venv/*",
              ],
              delete_patterns=["*"],
          )
          print(f"::notice::HF Space now at commit {target_sha}")
          EOF

      - name: Restore branch checkout
        if: always()
        run: git checkout "${{ github.ref_name }}" || git checkout main || true

  # ── 4. POST-ROLLBACK HEALTH CHECK ───────────────────────────────────────────
  health-check:
    name: 🩺 Post-rollback health check
    runs-on: ubuntu-latest
    needs: [rollback-vercel, rollback-hf]
    if: ${{ !cancelled() && github.event.inputs.skip_health_check != 'true' }}
    steps:
      - name: Check HF Space health
        env:
          HF_SPACE_URL: https://huggingface.co/spaces/ahmdelbaz28/AhmedETAP-Platform
        run: |
          set -euo pipefail
          # The HF Space status endpoint returns the runtime status.
          # We poll for up to 5 minutes (30 × 10s) for a Running state.
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$HF_SPACE_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "::notice::HF Space is healthy (HTTP $STATUS after ${i}0s)."
              exit 0
            fi
            echo "Attempt $i: HF Space returned HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "::error::HF Space did not return HTTP 200 within 5 minutes after rollback."
          echo "Investigate at: $HF_SPACE_URL"
          exit 1

      - name: Check Vercel health (if rolled back)
        if: needs.validate.outputs.do_vercel == 'true'
        env:
          VERCEL_URL: ${{ github.event.inputs.vercel_deployment_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://$VERCEL_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "::notice::Vercel deployment is healthy (HTTP $STATUS after ${i}0s)."
              exit 0
            fi
            echo "Attempt $i: Vercel returned HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "::error::Vercel deployment did not return HTTP 200 within 2 minutes after rollback."
          echo "Investigate at: https://$VERCEL_URL"
          exit 1
