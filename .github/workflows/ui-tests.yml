name: UI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  vitest:
    name: Vitest (UI Components)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run vitest
        run: pnpm test || echo "Some UI tests failed (non-blocking)"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: ui/coverage/
          if-no-files-found: ignore
          retention-days: 14

  playwright:
    name: Playwright (E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install chromium
      - name: Start Vite dev server
        run: |
          ./node_modules/.bin/vite --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5173 > /dev/null 2>&1; then
              echo "✅ Vite ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Run Playwright E2E
        run: ./node_modules/.bin/playwright test --config=playwright.config.ts
        env:
          PLAYWRIGHT_DEV_HOST: '127.0.0.1'
          # Vite was already started by the step above — skip second launch
          PLAYWRIGHT_NO_WEBSERVER: '1'
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/playwright-results.xml
            ui/playwright-results.json
            ui/test-results/
          retention-days: 30
