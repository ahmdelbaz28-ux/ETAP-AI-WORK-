name: FOSSA License & Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # Weekly scan at 03:00 UTC on Mondays
  workflow_dispatch:

concurrency:
  group: fossa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fossa-scan:
    name: FOSSA Analysis & Compliance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.4
          run_install: false

      - name: Install uv and sync Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen --all-extras

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install FOSSA CLI
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash
          fossa --version

      - name: Run FOSSA Analyze
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          if [ -z "$FOSSA_API_KEY" ]; then
            echo "::warning::FOSSA_API_KEY is not set (fork PR). Skipping FOSSA scan."
            exit 0
          fi
          echo "Starting FOSSA dependency & license analysis..."
          fossa analyze

      - name: Run FOSSA Test (Blocking Gate)
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          if [ -z "$FOSSA_API_KEY" ]; then
            echo "::warning::FOSSA_API_KEY is not set. Skipping FOSSA test."
            exit 0
          fi
          echo "Checking FOSSA compliance policy rules (blocking)..."
          fossa test
