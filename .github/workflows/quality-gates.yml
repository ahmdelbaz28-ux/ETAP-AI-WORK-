name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required so the post-build job can upload Trivy SARIF results to the
# GitHub Security tab via github/codeql-action/upload-sarif@v3.
# Without 'security-events: write', the upload fails with
# "Resource not accessible by integration".
permissions:
  contents: read
  security-events: write

jobs:
  pre-commit:
    name: Lint, Syntax, Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # No pip cache — using uv for installation

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt ruff pytest pytest-asyncio pytest-cov respx

      - name: Ruff lint check
        run: ruff check . --config ruff.toml

      - name: Python syntax validation
        run: python3 validate_syntax.py

      - name: Engineering validation suite
        run: python3 scripts/dev/validation_suite.py

      - name: Engineering service tests
        run: pytest -q tests/test_engineering_service.py

  pre-build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: pre-commit
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate docker compose config
        run: docker compose --env-file .env.example config --quiet

      - name: Build engineering-service image
        run: docker build -f Dockerfile.engineering-service -t etap-engineering-service:ci .

  post-build:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: pre-build
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # No pip cache — using uv for installation

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt pytest pytest-asyncio pytest-cov respx

      - name: Run E2E smoke tests
        run: pytest -q tests/test_engineering_service.py

      - name: Run Trivy filesystem scan (via Docker image)
        # NOTE: We use the official Trivy Docker image directly instead of
        # aquasecurity/trivy-action. The action's setup-trivy dependency chain
        # has been repeatedly broken (v0.28.0 was deleted; v0.32.0 install.sh
        # fails on Ubuntu 24.04). The Docker image is published and tested by
        # the Trivy team and is far more stable.
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            -v /tmp/trivy-cache:/root/.cache/trivy \
            -w /repo \
            aquasec/trivy:latest \
            fs --exit-code 1 --severity CRITICAL \
               --ignore-unfixed \
               --skip-dirs .git,node_modules,ui/node_modules,.venv,venv,__pycache__ \
               --format sarif \
               --output /repo/trivy-results.sarif \
               .

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()
