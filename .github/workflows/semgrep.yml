# =============================================================================
# AhmedETAP — Deep Security Scan (Semgrep + Bandit + Custom Rules)
# -----------------------------------------------------------------------------
# Runs Semgrep with the official Python + security rulesets, plus custom
# project-specific rules. This catches:
#   - SQL injection (in addition to bandit)
#   - XSS, SSRF, path traversal
#   - Hardcoded credentials
#   - Insecure deserialization
#   - Weak crypto
#   - Logger injection
#   - FastAPI/SQLAlchemy-specific issues
#
# Triggers:
#   - Push/PR to main
#   - Weekly schedule (catches new rule additions)
# =============================================================================
name: Deep Security Scan (Semgrep)

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '.github/workflows/semgrep.yml'
      - 'semgrep.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
  schedule:
    # Weekly on Saturday at 03:00 UTC — catches new rule additions
    - cron: '0 3 * * 6'
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # Required to upload SARIF to GitHub Security tab

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Pin to a specific Semgrep version for reproducibility
      image: returntocorp/semgrep:1.96.0

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Run Semgrep with security rulesets
        run: |
          echo "Running Semgrep with security rulesets..."
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/bandit \
            --config p/insecure-transport \
            --config p/sql-injection \
            --config p/xss \
            --config p/command-injection \
            --config p/secure-defaults \
            --config semgrep.yml \
            --sarif \
            --output semgrep-results.sarif \
            --exclude 'tests/**' \
            --exclude 'testsprite_tests/**' \
            --exclude 'acp_runtime/acp_tests/**' \
            --exclude 'benchmarks/**' \
            --exclude 'node_modules/**' \
            --exclude 'ui/node_modules/**' \
            --exclude '.venv/**' \
            --exclude 'venv/**' \
            --exclude '__pycache__/**' \
            --exclude '.git/**' \
            --exclude 'docs/**' \
            --exclude '*.md' \
            --metrics off

      - name: Generate summary report
        if: always()
        run: |
          if [ ! -f semgrep-results.sarif ]; then
            echo "::error::Semgrep did not produce a SARIF report — scan failed"
            exit 1
          fi
          python3 - <<'PYEOF'
          import json, sys

          with open('semgrep-results.sarif') as f:
              sarif = json.load(f)

          # Normalize security-severity for GitHub Code Scanning (requires numeric 0.0 - 10.0)
          sev_score_map = {
              "critical": "9.0",
              "high": "8.0",
              "medium": "5.5",
              "low": "2.0",
              "info": "1.0",
          }
          for r in sarif.get("runs", []):
              for rule in r.get("tool", {}).get("driver", {}).get("rules", []):
                  props = rule.get("properties", {})
                  if "security-severity" in props:
                      raw_sev = str(props["security-severity"]).strip().lower()
                      if raw_sev in sev_score_map:
                          props["security-severity"] = sev_score_map[raw_sev]
                      else:
                          try:
                              float(raw_sev)
                          except ValueError:
                              props["security-severity"] = "5.5"

          with open('semgrep-results.sarif', 'w') as f:
              json.dump(sarif, f)

          runs = sarif.get('runs', [])
          results = []
          errors = []

          for run in runs:
              for res in run.get('results', []):
                  level = res.get('level', 'warning').upper()
                  sev_map = {'ERROR': 'ERROR', 'WARNING': 'WARNING', 'NOTE': 'INFO', 'NONE': 'INFO'}
                  sev = sev_map.get(level, 'WARNING')
                  locs = res.get('locations', [])
                  path = '?'
                  start_line = 1
                  if locs:
                      ploc = locs[0].get('physicalLocation', {})
                      path = ploc.get('artifactLocation', {}).get('uri', '?')
                      start_line = ploc.get('region', {}).get('startLine', 1)
                  results.append({
                      'check_id': res.get('ruleId', '?'),
                      'path': path,
                      'start': {'line': start_line},
                      'extra': {
                          'severity': sev,
                          'message': res.get('message', {}).get('text', '')
                      }
                  })

          # Write semgrep-results.json for artifact upload
          with open('semgrep-results.json', 'w') as f:
              json.dump({'results': results, 'errors': errors}, f, indent=2)

          # Group by severity
          by_severity = {}
          for r in results:
              sev = r.get('extra', {}).get('severity', 'UNKNOWN')
              by_severity.setdefault(sev, []).append(r)

          print("=" * 60)
          print("  Semgrep Scan Summary")
          print("=" * 60)
          print(f"  Total findings: {len(results)}")
          print(f"  Errors:         {len(errors)}")
          print()
          print("  By severity:")
          for sev in ['ERROR', 'WARNING', 'INFO']:
              count = len(by_severity.get(sev, []))
              if count > 0:
                  print(f"    {sev:10s}: {count}")

          print()
          print("  Top 10 findings:")
          for i, r in enumerate(results[:10], 1):
              rule_id = r.get('check_id', '?').split('.')[-1]
              path = r.get('path', '?')
              line = r.get('start', {}).get('line', '?')
              sev = r.get('extra', {}).get('severity', '?')
              message = r.get('extra', {}).get('message', '')[:80]
              print(f"    {i}. [{sev}] {rule_id}")
              print(f"       {path}:{line}")
              print(f"       {message}")
              print()

          error_count = len(by_severity.get('ERROR', []))
          warning_count = len(by_severity.get('WARNING', []))
          if error_count > 0:
              print(f"Blocking findings: {error_count} ERROR")
              sys.exit(1)
          else:
              print("No blocking ERROR findings")
          PYEOF

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload Semgrep results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        if: always()
        with:
          name: semgrep-results-${{ github.sha }}
          path: |
            semgrep-results.json
            semgrep-results.sarif
          retention-days: 30
          if-no-files-found: ignore
