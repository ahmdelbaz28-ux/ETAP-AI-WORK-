name: Prompt Sync & Validation

on:
  push:
    branches:
      - main
    paths:
      - 'prompts/**'
      - 'prompts-lock.json'
      - 'scripts/sync_to_langfuse.py'
      - 'scripts/validate_prompts.py'
  workflow_dispatch:

jobs:
  sync-prompts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml langfuse pydantic

      - name: Validate Prompts & Integrity Lock
        run: |
          python scripts/validate_prompts.py

      - name: Sync Prompts to Langfuse Cloud
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
        run: |
          python scripts/sync_to_langfuse.py
