name: Prompt Sync & Validation

on:
  push:
    branches:
      - main
    paths:
      - 'prompts/**'
      - 'prompts-lock.json'
      - 'scripts/sync_to_langfuse.py'
      - 'scripts/validate_prompts.py'
  workflow_dispatch:

permissions:
  contents: read  # Least privilege — only read repo contents

jobs:
  sync-prompts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1 --only-binary :all:
          pip install --only-binary :all: pyyaml==6.0.2 langfuse==2.51.0 pydantic==2.9.2

      - name: Validate Prompts & Integrity Lock
        run: |
          python scripts/validate_prompts.py

      - name: Sync Prompts to Langfuse Cloud
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
        run: |
          if [ -z "$LANGFUSE_PUBLIC_KEY" ] || [ -z "$LANGFUSE_SECRET_KEY" ]; then
            echo "⚠️ LANGFUSE secrets not configured — skipping prompt sync"
            exit 0
          fi
          python scripts/sync_to_langfuse.py
