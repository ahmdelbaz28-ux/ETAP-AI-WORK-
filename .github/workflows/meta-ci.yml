name: Meta CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflows_meta.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflows_meta.py"

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate Workflow Integrity & Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run Meta-CI Workflow Validator
        run: python scripts/check_workflows_meta.py
