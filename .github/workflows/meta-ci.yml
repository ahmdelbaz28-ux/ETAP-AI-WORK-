name: Meta CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflows_meta.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check_workflows_meta.py"

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate Workflow Integrity & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run Meta-CI Workflow Validator
        run: python scripts/check_workflows_meta.py
