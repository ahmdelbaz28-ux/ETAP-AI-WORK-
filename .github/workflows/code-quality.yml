name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  python-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Install linters
        run: pip install "ruff==0.16.6"
      - name: Ruff lint
        run: ruff check . --config ruff.toml --output-format=github
      - name: Python syntax validation
        run: python3 validate_syntax.py

  typescript-lint:
    name: TypeScript Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript type check
        run: pnpm lint
        continue-on-error: true
      - name: TypeScript tests
        run: pnpm test
        continue-on-error: true

  yaml-validate:
    name: YAML & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Install YAML parser
        run: pip install "pyyaml>=6"
      - name: Validate Makefile targets unique
        run: |
          dupes=$(grep -oE '^[a-zA-Z_-]+:' Makefile | sort | uniq -d || true)
          if [ -n "$dupes" ]; then
            echo "ERROR: duplicate Makefile targets:"; echo "$dupes"; exit 1
          fi
          echo "Makefile targets unique"
      - name: Validate YAML files
        run: |
          python3 -c "
          import yaml, sys, glob
          errors = []
          skip_dirs = ('.git/', 'node_modules/', '.venv/', '/venv/')
          tpl_dirs = ('charts/', 'helm/', 'templates/')
          files = (glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)
                   + glob.glob('.github/**/*.yml', recursive=True) + glob.glob('.github/**/*.yaml', recursive=True))
          seen = set()
          checked = 0
          tpl_checked = 0
          for f in files:
              if f in seen:
                  continue
              seen.add(f)
              if any(s in f for s in skip_dirs):
                  continue
              try:
                  text = open(f).read()
              except Exception as e:
                  errors.append(f'{f}: read error {e}')
                  continue
              if any(s in f for s in tpl_dirs):
                  tpl_checked += 1
                  for (o, c) in (('{{', '}}'), ('{%', '%}')):
                      if text.count(o) != text.count(c):
                          errors.append(f'{f}: unbalanced template delimiters {o}={text.count(o)} vs {c}={text.count(c)}')
                  continue
              checked += 1
              try:
                  list(yaml.safe_load_all(text))
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          wf = [f for f in seen if f.startswith('.github/workflows/')]
          if checked == 0 or not wf:
              print(f'ERROR: validator covered nothing (checked={checked}, workflows={len(wf)})')
              sys.exit(1)
          print(f'All YAML files validated successfully ({checked} yaml parsed, {tpl_checked} templates checked, {len(wf)} workflows)')
          "
