# Use SealedSecret or ExternalSecret for secure password provisioning.
# Generate sealed secret:
# kubectl create secret generic etap-redis-cluster --namespace etap --from-literal=redis-password=YOUR_REDIS_PASSWORD --dry-run=client -o yaml | kubeseal -o yaml > sealed-redis-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: etap-redis-cluster
  namespace: etap
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/part-of: etap-ai-platform
spec:
  encryptedData:
    redis-password: ""
---
# PodDisruptionBudget — keep quorum through node drains.
# A 6-node cluster tolerates losing 1 replica per shard (3 of 6 pods).
# Setting minAvailable=4 means: at most 2 pods down at any time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etap-redis-cluster
  namespace: etap
  labels:
    app.kubernetes.io/name: redis-cluster
    app.kubernetes.io/part-of: etap-ai-platform
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cluster
