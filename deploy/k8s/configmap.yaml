apiVersion: v1
kind: ConfigMap
metadata:
  name: etap-config
  namespace: etap
  labels:
    app.kubernetes.io/name: etap
    app.kubernetes.io/part-of: etap
data:
  APP_ENV: "production"
  LOG_LEVEL: "WARNING"
  MEMORY_LLM_PROVIDER: "gemini"
  MEMORY_LLM_MODEL: "gemini-2.0-flash"
  DATABASE_URL: "postgresql+asyncpg://etap:$(DB_PASSWORD)@etap-db:5432/etap"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@etap-redis:6379/0"
  WORKER_MODE: "default"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_WORKERS: "4"
  CORS_ORIGINS: "https://etap.example.com"
  DB_HOST: "etap-db"
  DB_PORT: "5432"
  DB_NAME: "etap"
  DB_USER: "etap"
  REDIS_HOST: "etap-redis"
  REDIS_PORT: "6379"
  TZ: "UTC"
