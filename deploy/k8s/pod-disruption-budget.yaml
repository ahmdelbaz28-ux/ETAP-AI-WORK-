apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etap-api-pdb
  namespace: etap
  labels:
    app.kubernetes.io/name: etap
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: etap
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: etap
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etap-worker-pdb
  namespace: etap
  labels:
    app.kubernetes.io/name: etap
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: etap
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etap
      app.kubernetes.io/component: worker
