# Grafana Loki + Promtail for SIEM Integration
# SECURITY AUDIT 2026-07-29 — Loki port bound to 127.0.0.1; anonymous Grafana
# disabled (was GF_AUTH_ANONYMOUS_ENABLED=true, allowing unauthenticated access
# to logs and dashboards from any network interface).
# Usage: docker compose -f docker-compose.loki.yml up -d
version: "3.8"

services:
  loki:
    image: grafana/loki:2.9.0
    container_name: etap-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: etap-promtail
    volumes:
      - /var/log:/var/log:ro
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: etap-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # SECURITY: Anonymous access disabled — previously allowed unauthenticated
      # users to view all logs and dashboards. Use admin credentials instead.
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-datasources:/etc/grafana/provisioning/datasources
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
