name = "ahmedetap-staging-proxy"
main = "worker.staging.js"
compatibility_date = "2024-09-01"
account_id = "8ea12977423cb0079cf4d227a0195bb1"

# Domainless staging deployment on Cloudflare Workers free subdomain (*.workers.dev)
# URL: https://ahmedetap-staging-proxy.ahmedetap.workers.dev
workers_dev = true

[vars]
ENVIRONMENT = "staging"
# Staging origin must be dynamically configured by staging runner.
# Hardcoding production Hugging Face or leaving invalid URL fails closed.
ORIGIN_URL = ""

[observability]
enabled = true
head_sampling_rate = 1
